- name: D5 re-check - mint a key, then use it for the INVENTORY plugin
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/vergeio.vergeos.all: { insecure: true }
  tasks:
    - name: clean
      vergeio.vergeos.api_key:
        user: "{{ lookup('env','VERGEOS_USERNAME') }}"
        name: zz-d5-inv-key
        state: absent
    - name: mint key
      vergeio.vergeos.api_key:
        user: "{{ lookup('env','VERGEOS_USERNAME') }}"
        name: zz-d5-inv-key
        state: present
      register: key
    - name: write an inventory file that authenticates with the TOKEN only
      ansible.builtin.copy:
        dest: /tmp/zz_tokeninv.vergeos.yml
        mode: "0600"
        content: |
          plugin: vergeio.vergeos.vergeos_vms
          sites:
            - name: lab
              host: "{{ lookup('env','VERGEOS_HOST') }}"
              api_key: "{{ key.secret }}"
              insecure: true
