---
# D1 extent: (a) does the module's RETURN VALUE report the desired state
# even though the server kept the old one? (b) does it ever converge?
- name: D1 return-value fidelity and convergence
  hosts: localhost
  gather_facts: false
  vars: { vm_n: zz-d1c-vm }
  module_defaults:
    group/vergeio.vergeos.all: { insecure: true }
  tasks:
    - name: clean
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: absent }
    - name: create BEFORE/1/512
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 1
        ram: 512
        description: BEFORE
        state: present

    - name: "update run 1"
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 4
        ram: 2048
        description: AFTER
        state: present
      register: r1
    - name: "update run 2 (identical)"
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 4
        ram: 2048
        description: AFTER
        state: present
      register: r2
    - name: "update run 3 (identical)"
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 4
        ram: 2048
        description: AFTER
        state: present
      register: r3

    - name: server truth
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "vms?fields=name,description,cpu_cores,ram&filter=name eq '{{ vm_n }}'"]
      register: truth
      changed_when: false

    - name: "D1 CONVERGENCE + RETURN-VALUE RESULTS"
      ansible.builtin.debug:
        msg:
          - "run1 changed={{ r1.changed }}  run2 changed={{ r2.changed }}  run3 changed={{ r3.changed }}"
          - "module RETURNED  : description={{ r3.vm.description | default('?') }} cpu_cores={{ r3.vm.cpu_cores | default('?') }} ram={{ r3.vm.ram | default('?') }}"
          - "server ACTUALLY has: {{ truth.stdout }}"

    - name: teardown
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: absent }
