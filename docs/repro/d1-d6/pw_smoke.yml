- name: Is the collection fully functional on password auth alone?
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/vergeio.vergeos.info: { insecure: true }
  tasks:
    - vergeio.vergeos.vm_info: {}
      register: r_vm
    - vergeio.vergeos.network_info: {}
      register: r_net
    - vergeio.vergeos.cluster_info: {}
      register: r_cl
    - vergeio.vergeos.node_info: {}
      register: r_node
    - vergeio.vergeos.physical_drive_info: {}
      register: r_pd
    - vergeio.vergeos.group_info: {}
      register: r_grp
    - vergeio.vergeos.file_info: {}
      register: r_file
    - vergeio.vergeos.update_info: {}
      register: r_upd
    - vergeio.vergeos.site_sync_info: {}
      register: r_ss
    - vergeio.vergeos.vm_recipe_info: {}
      register: r_rec
    - vergeio.vergeos.tenant_info: {}
      register: r_ten
    - vergeio.vergeos.api_key_info:
        user: "{{ lookup('env','VERGEOS_USERNAME') }}"
      register: r_ak
    - vergeio.vergeos.auth_source_info: {}
      register: r_as
    - vergeio.vergeos.vnet_rule_info:
        network: External
      register: r_vr
    - name: RESULT
      ansible.builtin.debug:
        msg: >-
          14 read modules under password auth:
          failures={{ [r_vm,r_net,r_cl,r_node,r_pd,r_grp,r_file,r_upd,r_ss,r_rec,r_ten,r_ak,r_as,r_vr]
                      | selectattr('failed','defined') | selectattr('failed') | list | length }}
