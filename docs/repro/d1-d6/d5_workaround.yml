- name: D5 - is there a usable workaround through the modules today?
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/vergeio.vergeos.all: { insecure: true }
  tasks:
    - name: clean
      vergeio.vergeos.api_key:
        user: "{{ lookup('env','VERGEOS_USERNAME') }}"
        name: zz-d5-wa
        state: absent
    - name: mint key
      vergeio.vergeos.api_key:
        user: "{{ lookup('env','VERGEOS_USERNAME') }}"
        name: zz-d5-wa
        state: present
      register: key

    - name: "W1. token as password, real username"
      vergeio.vergeos.vm_info:
        host: "{{ lookup('env','VERGEOS_HOST') }}"
        username: "{{ lookup('env','VERGEOS_USERNAME') }}"
        password: "{{ key.secret }}"
      register: w1
      ignore_errors: true

    - name: "W2. token as password, username omitted-ish"
      vergeio.vergeos.vm_info:
        host: "{{ lookup('env','VERGEOS_HOST') }}"
        username: "{{ key.secret }}"
        password: "{{ key.secret }}"
      register: w2
      ignore_errors: true

    - name: "D5 WORKAROUND RESULTS"
      ansible.builtin.debug:
        msg:
          - "token-as-password (real user): failed={{ w1 is failed }} {{ (w1.msg | default(''))[:90] }}"
          - "token-as-both                : failed={{ w2 is failed }} {{ (w2.msg | default(''))[:90] }}"

    - name: teardown
      vergeio.vergeos.api_key:
        user: "{{ lookup('env','VERGEOS_USERNAME') }}"
        name: zz-d5-wa
        state: absent
