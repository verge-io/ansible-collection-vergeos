---
requires_ansible: ">=2.15.0"

# Action groups let a play set connection details once with `module_defaults`
# instead of repeating host/username/password/insecure on every task.
#
# Worth knowing: without this section, `group/vergeio.vergeos.recipe` does not
# degrade gracefully -- it fails outright with "could not resolve the
# module_defaults group". The absence of an action group is a hard error for
# anyone who tries the idiomatic thing, not a missing convenience.
#
# Scoped to the modules this PR adds. A collection-wide `all` group belongs
# with the rest of the port rather than here.
action_groups:
  recipe:
    - vm_recipe_deploy
    - vm_recipe_info
    - vm_drive_info
    - vm_nic_info
