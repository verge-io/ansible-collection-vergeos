---
# Capacity gate. cluster_info does the N-1 arithmetic against the live
# cluster_status table, so the verdict is the platform's own numbers
# rather than a Jinja reimplementation of them.
- name: Ask whether the drain fits
  vergeio.vergeos.cluster_info:
    host: "{{ node_drain_host }}"
    username: "{{ node_drain_username }}"
    password: "{{ node_drain_password }}"
    insecure: "{{ node_drain_insecure }}"
    drain_candidates: ["{{ node_drain_node }}"]
  register: node_drain_capacity
  changed_when: false

- name: Record the verdict
  ansible.builtin.set_fact:
    node_drain_check: >-
      {{ node_drain_capacity.drain_checks
         | selectattr('node', 'equalto', node_drain_node) | first }}

- name: Preflight verdict
  ansible.builtin.debug:
    msg: >-
      {{ 'FITS' if node_drain_check.fits else 'DOES NOT FIT' }}:
      {{ node_drain_check.reason }}

- name: Which VMs would have to move
  vergeio.vergeos.vm_info:
    host: "{{ node_drain_host }}"
    username: "{{ node_drain_username }}"
    password: "{{ node_drain_password }}"
    insecure: "{{ node_drain_insecure }}"
  register: node_drain_vms_before
  changed_when: false

- name: Report the evacuation set
  ansible.builtin.debug:
    msg: >-
      {{ node_drain_on_target | length }} running VM(s) on
      '{{ node_drain_node }}':
      {{ node_drain_on_target | map(attribute='name') | list }}
  vars:
    node_drain_on_target: >-
      {{ node_drain_vms_before.vms | selectattr('running')
         | selectattr('node_name', 'equalto', node_drain_node) | list }}

# Report-only unless somebody says yes. This is the default path.
- name: Stop here unless the drain was explicitly confirmed
  ansible.builtin.debug:
    msg: >-
      Preflight only. Set node_drain_confirm=yes to actually drain
      '{{ node_drain_node }}'.
  when: node_drain_confirm | string != 'yes'

- name: Refuse a drain the cluster cannot absorb
  ansible.builtin.fail:
    msg: >-
      Refusing to drain '{{ node_drain_node }}': {{ node_drain_check.reason }}.
      The platform would accept this and then stall indefinitely with no
      error. Free capacity first, or set node_drain_force=true if you
      genuinely want that.
  when:
    - node_drain_confirm | string == 'yes'
    - not node_drain_check.fits
    - not node_drain_force

- name: Enter maintenance mode
  vergeio.vergeos.node_maintenance:
    host: "{{ node_drain_host }}"
    username: "{{ node_drain_username }}"
    password: "{{ node_drain_password }}"
    insecure: "{{ node_drain_insecure }}"
    name: "{{ node_drain_node }}"
    state: maintenance
  when: node_drain_confirm | string == 'yes'

# The completion signal is NOT the maintenance flag. The platform sets
# that as soon as the request is accepted -- measured at under a second
# on this lab, while 32 GB of VMs were still resident and the node read
# status 'migrating'. A role that trusted the flag would restart a node
# with live workloads on it, which is the exact failure it exists to
# prevent. The real signal is zero RUNNING VMs whose node_name is the
# drained node.
- name: Wait for the node to actually empty
  vergeio.vergeos.vm_info:
    host: "{{ node_drain_host }}"
    username: "{{ node_drain_username }}"
    password: "{{ node_drain_password }}"
    insecure: "{{ node_drain_insecure }}"
  register: node_drain_watch
  until: >-
    node_drain_watch.vms | selectattr('running')
    | selectattr('node_name', 'equalto', node_drain_node)
    | list | length == 0
  retries: "{{ (node_drain_timeout | int // node_drain_poll_interval | int) | int }}"
  delay: "{{ node_drain_poll_interval }}"
  changed_when: false
  when: node_drain_confirm | string == 'yes'

- name: Drained
  ansible.builtin.debug:
    msg: >-
      '{{ node_drain_node }}' is drained: 0 running VMs remain on it.
  when: node_drain_confirm | string == 'yes'
