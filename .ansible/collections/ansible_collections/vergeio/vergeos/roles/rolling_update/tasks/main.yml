---
# rolling_update -- get a platform update onto every node without an outage,
# by preparing it, checking the cluster can survive losing a node, and then
# handing the reboot to the platform.
#
# What this role does NOT do, and why: it does not drain, wait, restart and
# undrain each node itself. The platform already does exactly that -- the
# 'apply' update action reboots nodes one at a time migrating workloads first,
# and nodes/{key}/maintenance_reboot does the same for a single node. An
# earlier version of this role reimplemented that sequence and got it wrong:
# it treated maintenance=True as "evacuation finished", which the platform
# sets in under a second while RAM is still resident, so it would restart a
# node whose workloads had not moved. Reimplementing a vendor primitive means
# owning its race conditions.
#
# What the platform does NOT do is refuse to start when there is nowhere for
# the workloads to go. Measured: draining a node on a cluster with an 18 GB
# RAM shortfall was accepted, flipped the node to maintenance immediately, and
# then stalled mid-migration for fourteen minutes with no destination. That
# check is the substance this role adds.

- name: Preflight -- connection is configured
  ansible.builtin.assert:
    that: rolling_update_host | length > 0
    fail_msg: >-
      rolling_update needs rolling_update_host (or VERGEOS_HOST).
    quiet: true

- name: Survey the cluster before anything changes
  vergeio.vergeos.node_info:
    host: "{{ rolling_update_host }}"
    username: "{{ rolling_update_username }}"
    password: "{{ rolling_update_password }}"
    insecure: "{{ rolling_update_insecure }}"
  register: rolling_update_before
  changed_when: false

# Recorded now, because it is the baseline the health gate compares against
# afterwards. Reading "how many nodes should be online" from the live cluster
# after the roll would let the answer drift downwards -- a node that failed to
# come back quietly becoming the new normal.
- name: Record the pre-update baseline
  ansible.builtin.set_fact:
    rolling_update_baseline_online: >-
      {{ rolling_update_before.online | map(attribute='name') | list | sort }}

- name: Report the cluster as found
  ansible.builtin.debug:
    msg:
      online: "{{ rolling_update_baseline_online }}"
      in_maintenance: >-
        {{ rolling_update_before.maintenance | map(attribute='name') | list }}
      already_pending_restart: >-
        {{ rolling_update_before.needs_restart | map(attribute='name') | list }}

# ── System-wide lifecycle ────────────────────────────────────────────────────
# Check, download and install are cluster-wide and reboot nothing, so they run
# whether or not consent has been given. That makes the default path an honest
# dry run: the update is staged and the role reports what applying it would
# reboot.

- name: Run the system-wide update lifecycle
  vergeio.vergeos.update:
    host: "{{ rolling_update_host }}"
    username: "{{ rolling_update_username }}"
    password: "{{ rolling_update_password }}"
    insecure: "{{ rolling_update_insecure }}"
    state: "{{ rolling_update_stage }}"
  register: rolling_update_lifecycle

- name: Report the update
  ansible.builtin.debug:
    msg:
      source: "{{ rolling_update_lifecycle.source }}"
      branch: "{{ rolling_update_lifecycle.branch }}"
      stages_run: "{{ rolling_update_lifecycle.stages_run }}"
      installed: "{{ rolling_update_lifecycle.installed }}"
      reboot_required: "{{ rolling_update_lifecycle.reboot_required }}"

- name: Re-read the nodes now the update is installed
  vergeio.vergeos.node_info:
    host: "{{ rolling_update_host }}"
    username: "{{ rolling_update_username }}"
    password: "{{ rolling_update_password }}"
    insecure: "{{ rolling_update_insecure }}"
  register: rolling_update_after_install
  changed_when: false

- name: Note which nodes the platform says are waiting for a restart
  ansible.builtin.set_fact:
    rolling_update_targets: >-
      {{ rolling_update_after_install.needs_restart
         | map(attribute='name') | list }}

# ── Capacity gate -- the reason this role exists ─────────────────────────────
# Asked for every node that will be rebooted, one at a time, because that is
# how the platform rolls: a node at a time, each needing somewhere for its
# workloads to go while it is down.

- name: Can the cluster survive losing each node in turn
  vergeio.vergeos.cluster_info:
    host: "{{ rolling_update_host }}"
    username: "{{ rolling_update_username }}"
    password: "{{ rolling_update_password }}"
    insecure: "{{ rolling_update_insecure }}"
    drain_candidates: "{{ rolling_update_targets }}"
  register: rolling_update_capacity
  changed_when: false
  when: rolling_update_targets | length > 0

- name: Report capacity
  ansible.builtin.debug:
    msg:
      ram_headroom_mb: "{{ rolling_update_capacity.ram_headroom_mb }}"
      no_failover_reservation: >-
        {{ rolling_update_capacity.no_failover_reservation }}
      verdicts: >-
        {{ rolling_update_capacity.drain_checks
           | map(attribute='reason') | list }}
  when: rolling_update_targets | length > 0

# fits is deliberately compared to false rather than tested for truth: the
# module returns none when it could not determine capacity, and "could not
# tell" must not pass a gate whose whole job is to be certain.
- name: Every node that will reboot must have somewhere to evacuate to
  ansible.builtin.assert:
    that: >-
      rolling_update_capacity.drain_checks
      | rejectattr('fits', 'equalto', true) | list | length == 0
    fail_msg: >-
      refusing to start the roll.
      {{ rolling_update_capacity.drain_checks
         | rejectattr('fits', 'equalto', true)
         | map(attribute='reason') | join(' ') }}
      Free RAM, shut something down, or add capacity first. The update is
      installed and will keep until you do.
    success_msg: >-
      every node that needs a restart has somewhere to put its workloads.
    quiet: true
  when:
    - rolling_update_targets | length > 0
    - rolling_update_capacity_gate | bool

- name: Report the plan
  ansible.builtin.debug:
    msg: >-
      {{ ("the platform will reboot, one at a time: " ~ rolling_update_targets)
         if rolling_update_targets | length > 0
         else "no node needs restarting; nothing to roll" }}

# ── Consent ──────────────────────────────────────────────────────────────────
# After the plan and the capacity verdict are printed, so that a run without
# consent is a full preflight rather than a mode someone has to know to ask
# for.

- name: Stop before rebooting anything
  ansible.builtin.debug:
    msg: >-
      rolling_update_confirm is not "yes", so nothing will be rebooted.
      The update is staged; re-run with -e rolling_update_confirm=yes to
      apply it to {{ rolling_update_targets | length }} node(s).
  when:
    - rolling_update_targets | length > 0
    - rolling_update_confirm != "yes"

# ── Apply ────────────────────────────────────────────────────────────────────

- name: Hand the roll to the platform
  vergeio.vergeos.update:
    host: "{{ rolling_update_host }}"
    username: "{{ rolling_update_username }}"
    password: "{{ rolling_update_password }}"
    insecure: "{{ rolling_update_insecure }}"
    state: applied
    force: "{{ rolling_update_force | bool }}"
  register: rolling_update_applied
  when:
    - rolling_update_targets | length > 0
    - rolling_update_confirm == "yes"

# The apply action returns as soon as the roll is accepted, not when it is
# finished, so there is nothing to verify yet -- waiting is a separate step
# rather than an assumption baked into the call above.
- name: Wait for the roll to finish
  vergeio.vergeos.node_info:
    host: "{{ rolling_update_host }}"
    username: "{{ rolling_update_username }}"
    password: "{{ rolling_update_password }}"
    insecure: "{{ rolling_update_insecure }}"
  register: rolling_update_settled
  changed_when: false
  failed_when: false
  retries: >-
    {{ (rolling_update_roll_timeout | int
        // (rolling_update_poll_interval | int)) | int }}
  delay: "{{ rolling_update_poll_interval | int }}"
  until: >-
    rolling_update_settled.needs_restart | default([]) | length == 0
    and rolling_update_settled.maintenance | default([]) | length == 0
    and (rolling_update_settled.online | default([]) | map(attribute='name')
         | list | sort) == rolling_update_baseline_online
  when:
    - rolling_update_targets | length > 0
    - rolling_update_confirm == "yes"
    - rolling_update_wait | bool

# ── Post-verify ──────────────────────────────────────────────────────────────
# The other half of what a role adds over the bare action: the platform
# reports that it started the roll, not that the cluster came out of it in the
# same shape it went in.

- name: Health gate
  ansible.builtin.include_tasks: health_gate.yml
  when:
    - rolling_update_targets | length > 0
    - rolling_update_confirm == "yes"
    - rolling_update_wait | bool
    - rolling_update_health_gate | bool

- name: Rolling update complete
  ansible.builtin.debug:
    msg: >-
      the platform rolled {{ rolling_update_targets | length }} node(s):
      {{ rolling_update_targets }}
  when:
    - rolling_update_targets | length > 0
    - rolling_update_confirm == "yes"
