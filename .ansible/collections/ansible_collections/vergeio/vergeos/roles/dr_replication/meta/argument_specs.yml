---
argument_specs:
  main:
    short_description: Site-to-site replication as code, with an RPO watchdog
    description:
      - Reconciles declared outgoing site syncs, optionally triggers them, and
        then checks that replication is actually keeping up.
      - The two halves belong together. A sync that exists and is enabled tells
        you nothing; the failure this role is built around is a replication
        target that was configured once, looks correct, and has not moved data
        in weeks.
    author:
      - VergeIO (@vergeio)
    options:
      dr_replication_host:
        description:
          - VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      dr_replication_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      dr_replication_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      dr_replication_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
        default: false
      dr_replication_syncs:
        description:
          - Outgoing syncs that should exist. Each entry takes the same keys as
            the M(vergeio.vergeos.site_sync) module, minus the connection ones.
          - Leave empty to run as a pure watchdog; reconciliation is skipped
            entirely, so a monitoring-only run cannot converge anything.
        type: list
        elements: dict
        default: []
      dr_replication_exact:
        description:
          - Remove outgoing syncs not named in O(dr_replication_syncs).
          - Ignored when nothing is declared, so a watchdog run can never purge.
        type: bool
        default: false
      dr_replication_max_age:
        description:
          - Seconds since last run beyond which a sync is behind RPO. A sync
            that has never run always counts. Set to 0 to skip the check.
        type: int
        default: 86400
      dr_replication_watch:
        description:
          - Which direction the watchdog reports on.
        type: str
        choices: [outgoing, incoming, both]
        default: both
      dr_replication_fail_on_lag:
        description: Fail the play when replication is behind RPO.
        type: bool
        default: false
      dr_replication_fail_on_unhealthy:
        description: Fail the play when a sync is not positively healthy.
        type: bool
        default: false
      dr_replication_run_now:
        description:
          - Names of syncs to run immediately after reconciliation.
        type: list
        elements: str
        default: []
      dr_replication_wait:
        description: Wait for triggered syncs to finish.
        type: bool
        default: false
      dr_replication_wait_timeout:
        description: Seconds to allow a triggered sync to finish.
        type: int
        default: 7200
      dr_replication_poll_interval:
        description: Seconds between polls.
        type: int
        default: 30
