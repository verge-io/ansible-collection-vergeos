---
# D1 — do the five bare-save() modules persist an update?
# Each block: create -> change ONE field via the module -> read the value
# back over raw HTTP (no SDK, no collection code) -> compare.
- name: D1 update-persistence across the five affected modules
  hosts: localhost
  gather_facts: false
  vars:
    vm_n: zz-d1-vm
    user_n: zz-d1-user
    net_n: zz-d1-net
  module_defaults:
    group/vergeio.vergeos.all:
      insecure: true
  tasks:

    # ---------------------------------------------------------------- vm
    - name: "vm: clean"
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: absent }
    - name: "vm: create with cpu_cores=1 ram=512 description=BEFORE"
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 1
        ram: 512
        description: BEFORE
        state: present
    - name: "vm: UPDATE cpu_cores=4 ram=2048 description=AFTER"
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 4
        ram: 2048
        description: AFTER
        state: present
      register: vm_upd
    - name: "vm: independent read-back"
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "vms?fields=name,description,cpu_cores,ram&filter=name eq '{{ vm_n }}'"]
      register: vm_rb
      changed_when: false

    # -------------------------------------------------------------- user
    - name: "user: clean"
      vergeio.vergeos.user: { name: "{{ user_n }}", state: absent }
    - name: "user: create with full_name=BEFORE"
      vergeio.vergeos.user:
        name: "{{ user_n }}"
        user_password: "Str0ng-Pass!23"
        full_name: BEFORE
        email: before@example.com
        state: present
    - name: "user: UPDATE full_name=AFTER email=after@example.com"
      vergeio.vergeos.user:
        name: "{{ user_n }}"
        full_name: AFTER
        email: after@example.com
        state: present
      register: user_upd
    - name: "user: independent read-back"
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "users?fields=name,displayname,email&filter=name eq '{{ user_n }}'"]
      register: user_rb
      changed_when: false

    # ----------------------------------------------------------- network
    - name: "network: clean"
      vergeio.vergeos.network: { name: "{{ net_n }}", state: absent }
    - name: "network: create with description=BEFORE"
      vergeio.vergeos.network:
        name: "{{ net_n }}"
        network_type: internal
        description: BEFORE
        state: present
    - name: "network: UPDATE description=AFTER"
      vergeio.vergeos.network:
        name: "{{ net_n }}"
        description: AFTER
        state: present
      register: net_upd
    - name: "network: independent read-back"
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "vnets?fields=name,description&filter=name eq '{{ net_n }}'"]
      register: net_rb
      changed_when: false

    # --------------------------------------------------------------- nic
    - name: "nic: attach to the scratch VM on the scratch network"
      vergeio.vergeos.nic:
        vm_name: "{{ vm_n }}"
        network: "{{ net_n }}"
        nic_type: virtio
        state: present
    - name: "nic: UPDATE nic_type virtio -> e1000"
      vergeio.vergeos.nic:
        vm_name: "{{ vm_n }}"
        network: "{{ net_n }}"
        nic_type: e1000
        state: present
      register: nic_upd
    - name: "nic: independent read-back"
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "machine_nics?fields=name,interface,enabled"]
      register: nic_rb
      changed_when: false

    # ------------------------------------------------------------- drive
    - name: "drive: add a 1 GB drive"
      vergeio.vergeos.drive:
        vm_name: "{{ vm_n }}"
        name: zz-d1-drive
        size: 1
        drive_type: virtio
        state: present
    - name: "drive: UPDATE drive_type virtio -> sata"
      vergeio.vergeos.drive:
        vm_name: "{{ vm_n }}"
        name: zz-d1-drive
        drive_type: sata
        state: present
      register: drive_upd
    - name: "drive: independent read-back"
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "machine_drives?fields=name,interface,preferred_tier"]
      register: drive_rb
      changed_when: false

    # ------------------------------------------------------------ verdict
    - name: "D1 RESULTS"
      ansible.builtin.debug:
        msg:
          - "vm      module changed={{ vm_upd.changed }}    read-back: {{ vm_rb.stdout }}"
          - "user    module changed={{ user_upd.changed }}  read-back: {{ user_rb.stdout }}"
          - "network module changed={{ net_upd.changed }}   read-back: {{ net_rb.stdout }}"
          - "nic     module changed={{ nic_upd.changed }}   read-back: {{ nic_rb.stdout }}"
          - "drive   module changed={{ drive_upd.changed }} read-back: {{ drive_rb.stdout }}"

    # ----------------------------------------------------------- teardown
    - name: "teardown vm"
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: absent }
    - name: "teardown user"
      vergeio.vergeos.user: { name: "{{ user_n }}", state: absent }
    - name: "teardown network"
      vergeio.vergeos.network: { name: "{{ net_n }}", state: absent }
