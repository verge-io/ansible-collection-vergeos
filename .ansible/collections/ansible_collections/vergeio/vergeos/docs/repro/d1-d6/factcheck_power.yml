---
# FACT-CHECK: is the claim "creates and power actions are unaffected" true,
# or did I infer it from reading the code?
- name: D1 scope - power actions
  hosts: localhost
  gather_facts: false
  vars: { vm_n: zz-fc-pwr }
  module_defaults:
    group/vergeio.vergeos.all: { insecure: true }
  tasks:
    - name: clean
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: absent }
    - name: "create (does the CREATE path persist its fields?)"
      vergeio.vergeos.vm:
        name: "{{ vm_n }}"
        cpu_cores: 2
        ram: 1024
        description: CREATED-VALUES
        state: present
    - name: read back after create
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "vms?fields=name,description,cpu_cores,ram&filter=name eq '{{ vm_n }}'"]
      register: after_create
      changed_when: false

    - name: "power on"
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: running }
      register: pon
    - name: read power state after start
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "vms?fields=name,status,running&filter=name eq '{{ vm_n }}'"]
      register: running_state
      changed_when: false

    - name: "power off"
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: stopped }
      register: poff
    - name: read power state after stop
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", readback.py,
               "vms?fields=name,status,running&filter=name eq '{{ vm_n }}'"]
      register: stopped_state
      changed_when: false

    - name: "POWER/CREATE FACT-CHECK"
      ansible.builtin.debug:
        msg:
          - "create persisted?  {{ after_create.stdout }}"
          - "power on  changed={{ pon.changed }}  -> {{ running_state.stdout }}"
          - "power off changed={{ poff.changed }} -> {{ stopped_state.stdout }}"

    - name: teardown
      vergeio.vergeos.vm: { name: "{{ vm_n }}", state: absent }
