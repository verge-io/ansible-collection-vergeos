---
# Example playbook: deploy a VM from a native VergeOS recipe.
#
# Discover what a recipe accepts before writing the answer set:
#
#   ansible-playbook examples/deploy_from_recipe.yml --tags discover
#
# Then preflight without creating anything -- check mode runs the real
# server-side simulation:
#
#   ansible-playbook examples/deploy_from_recipe.yml --check
#
- name: Deploy a VergeOS VM from a recipe
  hosts: localhost
  gather_facts: false

  vars:
    vergeos_host: "{{ lookup('env', 'VERGEOS_HOST') | default('vergeos.example.com', true) }}"
    vergeos_username: "{{ lookup('env', 'VERGEOS_USERNAME') | default('admin', true) }}"
    vergeos_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
    vergeos_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true) }}"

    recipe_name: "Ubuntu Server 22.04 (Jammy Jellyfish)"
    vm_name: "web-01"

  tasks:
    # ── Discovery ────────────────────────────────────────────────────────────
    - name: List the recipes this system offers
      vergeio.vergeos.vm_recipe_info:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
      register: catalog
      tags: [discover]

    - name: Show the recipe names
      ansible.builtin.debug:
        msg: "{{ catalog.recipes | map(attribute='name') | list | sort }}"
      tags: [discover]

    - name: Discover what one recipe accepts, with valid values resolved
      vergeio.vergeos.vm_recipe_info:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        name: "{{ recipe_name }}"
        questions: true
        resolve_options: true
      register: recipe
      tags: [discover]

    - name: Show which questions must be answered, and which merely should be
      ansible.builtin.debug:
        msg:
          required: >-
            {{ recipe.questions | selectattr('required')
               | map(attribute='name') | list }}
          # A question that is optional with an empty default is the trap: the
          # deploy accepts it and then fails partway through building the VM.
          empty_default: >-
            {{ recipe.questions | rejectattr('required')
               | selectattr('default', 'in', ['', none])
               | map(attribute='name') | list }}
          credentials: "{{ recipe.secret_questions }}"
          table_backed: "{{ recipe.options.keys() | list }}"
      tags: [discover]

    # ── Deploy ───────────────────────────────────────────────────────────────
    - name: Deploy the VM
      vergeio.vergeos.vm_recipe_deploy:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        name: "{{ vm_name }}"
        recipe: "{{ recipe_name }}"
        answers:
          HOSTNAME: "{{ vm_name }}"
          USER: "ops"
          # Keep real credentials in a vault, not here.
          PASSWORD: "{{ vault_guest_password | default('change-me') }}"
          YB_CPU_CORES: 2
          YB_RAM: 4096                  # MB
          YB_DRIVE_OS_SIZE: 53687091200  # BYTES, not GB
          YB_IP_ADDR_TYPE: dhcp
          # Network NAME, resolved to its vnet key. Answer this explicitly:
          # its default creates a brand-new internal network, and a VM whose
          # NIC is attached to nothing still passes every other check.
          YB_NIC_ETH0: "External"
          # Optional with an empty default, and an empty storage tier makes the
          # recipe's own OS-drive step fail mid-deploy.
          SELECT_OS_TIER: 4
      register: deployed

    - name: Report what happened
      ansible.builtin.debug:
        msg:
          changed: "{{ deployed.changed }}"
          already_existed: "{{ deployed.already_existed }}"
          vm_key: "{{ deployed.vm_key }}"
          answers_sent: "{{ deployed.answers_sent }}"
          hints: "{{ deployed.hints }}"
          simulated_steps: >-
            {{ deployed.simulate_result.step_count | default('not simulated') }}

    # The deploy is asynchronous -- every stock cloud-image recipe builds its
    # OS drive with media=import, and the VM row appears while that image is
    # still downloading. Use the vm_from_recipe role instead of this playbook
    # when you need to wait for a VM that can actually boot.
