---
# Example playbook: can this cluster survive losing a node?
#
# Worth running on its own, before any maintenance that takes a node out of
# service -- not just an update. The platform accepts a drain whether or not
# there is anywhere for the workloads to go.
#
#   ansible-playbook examples/cluster_capacity.yml
#
- name: Report cluster capacity and drain feasibility
  hosts: localhost
  gather_facts: false

  vars:
    vergeos_host: "{{ lookup('env', 'VERGEOS_HOST') | default('vergeos.example.com', true) }}"
    vergeos_username: "{{ lookup('env', 'VERGEOS_USERNAME') | default('admin', true) }}"
    vergeos_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
    vergeos_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true) }}"

  tasks:
    - name: Read capacity, testing every node
      vergeio.vergeos.cluster_info:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        drain_candidates: "{{ node_names | default(omit) }}"
      register: capacity

    - name: Report
      ansible.builtin.debug:
        msg:
          ram_headroom_mb: "{{ capacity.ram_headroom_mb }}"
          # failover_ram is the platform's own N-1 reservation. Nodes listed
          # here hold nothing back for a peer failure, which means the cluster
          # is sized for all nodes being up.
          no_failover_reservation: "{{ capacity.no_failover_reservation }}"

    - name: Report each drain verdict
      ansible.builtin.debug:
        msg: "{{ item.reason }}"
      loop: "{{ capacity.drain_checks | default([]) }}"
      loop_control:
        label: "{{ item.node }}"

    - name: Refuse to proceed if any node cannot be drained
      ansible.builtin.assert:
        # Compared to true rather than tested for truth: fits is none when
        # capacity could not be determined, and that must not pass.
        that: >-
          capacity.drain_checks | default([])
          | rejectattr('fits', 'equalto', true) | list | length == 0
        fail_msg: >-
          {{ capacity.drain_checks
             | rejectattr('fits', 'equalto', true)
             | map(attribute='reason') | join(' ') }}
        quiet: true
