---
# Example playbook: Manage users and organization members
#
# The 'user' module uses 'name' for the target username and 'user_password'
# for the user's password. Auth credentials (username/password) are separate.
# The 'member' module uses 'name' for the target member username.
#
# There is no role column on a VergeOS user. The task named "Create a new
# admin user" puts the account in the administrators group; the permission
# task after it is what actually grants administration. A user task with
# Passing role=admin used to report success and create an ordinary user.
- name: Manage VergeIO users and members
  hosts: localhost
  gather_facts: false

  vars:
    vergeos_host: "{{ lookup('env', 'VERGEOS_HOST') | default('vergeos.example.com', true) }}"
    vergeos_username: "{{ lookup('env', 'VERGEOS_USERNAME') | default('admin', true) }}"
    vergeos_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
    vergeos_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true) }}"

  tasks:
    - name: Create the administrators group
      vergeio.vergeos.group:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        name: administrators
        description: System administrators
        state: present

    - name: Create a new admin user
      vergeio.vergeos.user:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        name: john.doe
        user_password: secure_password
        email: john.doe@example.com
        full_name: John Doe
        groups:
          - administrators
        enabled: true
        state: present

    - name: Grant the administrators group full control of the system
      vergeio.vergeos.permission:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        group: administrators
        table: "/"
        full_control: true

    - name: Create a read-only user
      vergeio.vergeos.user:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        name: viewer
        user_password: viewer_password
        email: viewer@example.com
        full_name: Read Only User
        state: present

    - name: Grant that user read-only sight of the whole system
      vergeio.vergeos.permission:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        user: viewer
        table: "/"
        rights:
          - list
          - read

    # The membership tasks below need this to exist first. Without it the
    # playbook died at "Group 'engineering' not found" on any system that had
    # not been prepared by hand.
    - name: Create the group the memberships reference
      vergeio.vergeos.group:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        name: engineering
        description: Engineering team
        state: present

    - name: Add user to group
      vergeio.vergeos.member:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        group: engineering
        name: john.doe
        state: present

    - name: Add another user to group
      vergeio.vergeos.member:
        host: "{{ vergeos_host }}"
        username: "{{ vergeos_username }}"
        password: "{{ vergeos_password }}"
        insecure: "{{ vergeos_insecure }}"
        group: engineering
        name: viewer
        state: present
