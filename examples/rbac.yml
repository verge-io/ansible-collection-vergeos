---
# Example playbook: VergeOS RBAC as code.
#
#   ansible-playbook examples/rbac.yml --check   # report the diff
#   ansible-playbook examples/rbac.yml
#
- name: Reconcile VergeOS groups and permissions
  hosts: localhost
  gather_facts: false

  # The rbac role assigns membership; it does not invent people. Without these
  # the example died with "cannot add user 'alice' to group 'operators': no
  # such user." on any system that had not been prepared by hand.
  #
  # These are demo accounts. Remove them with state=absent, or point
  # rbac_groups at users you already have and delete this block.
  pre_tasks:
    - name: Create the demo users this example assigns
      vergeio.vergeos.user:
        name: "{{ item }}"
        user_password: "{{ lookup('password', '/dev/null length=24') }}"
        full_name: "Demo user {{ item }}"
        state: present
      loop: [alice, bob, carol, dave]

  roles:
    - role: vergeio.vergeos.rbac
      vars:
        rbac_groups:
          - name: operators
            description: "Day-to-day VM operations"
            users: [alice, bob]
            permissions:
              # Can build and change VMs, but not destroy them.
              - table: vms
                rights: [list, read, create, modify]
              - table: vnets
                rights: [list, read]

          - name: auditors
            description: "Read-only sight of everything"
            users: [carol]
            permissions:
              # "/" is the system root -- a system-wide grant.
              - table: "/"
                rights: [list, read]

          - name: contractors
            description: "Scoped to one workload"
            users: [dave]
            # Nobody but dave, and remove anyone who is there now.
            exact_members: true
            permissions:
              - table: vms
                row: 42
                rights: [list, read, modify]

        # Adopt an existing estate with this false, read the report, then
        # flip it. It revokes grants held by the groups above that are not
        # listed above; groups absent from this document are untouched.
        rbac_exact_permissions: false
