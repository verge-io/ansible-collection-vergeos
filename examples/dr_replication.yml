---
# Example playbook: site-to-site replication as code, plus an RPO watchdog.
#
#   ansible-playbook examples/dr_replication.yml            # reconcile + check
#   ansible-playbook examples/dr_replication.yml --check    # report only
#
# As a scheduled watchdog, run it with dr_replication_syncs empty and the
# fail gates on -- it then converges nothing and only reports.
#
- name: Manage and verify VergeOS replication
  hosts: localhost
  gather_facts: false

  roles:
    - role: vergeio.vergeos.dr_replication
      vars:
        dr_replication_syncs:
          - name: "to-dr-site"
            site: 1
            # Issued by the matching INCOMING sync on the remote system.
            # Create-time only; it is never reconciled or echoed back.
            registration_code: "{{ vault_dr_registration_code }}"
            url: "https://dr.example.com"
            enabled: true
            encryption: true
            compression: true
            destination_tier: "4"
            threads: 4

        # Adopt an existing estate with this false first. Confirm the report
        # lists what you expect, then flip it -- deleting a sync tears down a
        # replication relationship.
        dr_replication_exact: false

        # Fail if anything is more than four hours behind, or not positively
        # reported healthy.
        dr_replication_max_age: 14400
        dr_replication_fail_on_lag: true
        dr_replication_fail_on_unhealthy: true
