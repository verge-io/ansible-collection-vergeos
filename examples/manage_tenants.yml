---
# Tenant-per-customer as code.
#
# Auth comes from the standard environment variables:
#   VERGEOS_HOST, VERGEOS_USERNAME, VERGEOS_PASSWORD, VERGEOS_INSECURE
#
# Run:  ansible-playbook examples/manage_tenants.yml

- name: Manage tenants declaratively
  hosts: localhost
  gather_facts: false

  vars:
    # Deliberately modest, and the tier is discovered rather than hardcoded.
    #
    # This example used to ask for 8 cores / 32 GB on tier 1 and 4 cores /
    # 16 GB on tier 3. On any system without a tier 3 it failed outright
    # ("Storage tier 3 not found"), and a tenant node that does not fit on a
    # single physical node never powers on -- the platform accepts the
    # poweron and silently leaves the tenant offline, so the play could only
    # report "Timed out after 180s waiting for tenant to be running".
    #
    # Size these to your own system before using this as anything but a demo.
    tenant_cpu_cores: 4
    tenant_ram_gb: 8
    tenant_storage_gb: 50
    # Tier 1 exists on a default install. Override for anything else:
    #   -e tenant_tier=2
    # The collection has no tier-discovery module yet, so this cannot be
    # derived automatically.
    tenant_tier: 1

  tasks:
    - name: Build the customer list
      ansible.builtin.set_fact:
        customers:
          - name: acme
            description: ACME Corp production tenant
            nodes:
              - name: acme-node1
                cpu_cores: "{{ tenant_cpu_cores }}"
                ram_gb: "{{ tenant_ram_gb }}"
            storage:
              - tier: "{{ tenant_tier }}"
                provisioned_gb: "{{ tenant_storage_gb }}"
          - name: globex
            description: Globex staging tenant
            nodes:
              - name: globex-node1
                cpu_cores: "{{ tenant_cpu_cores }}"
                ram_gb: "{{ tenant_ram_gb }}"
            storage:
              - tier: "{{ tenant_tier }}"
                provisioned_gb: "{{ tenant_storage_gb }}"

    - name: Ensure each customer tenant exists and is running
      vergeio.vergeos.tenant:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        nodes: "{{ item.nodes }}"
        storage: "{{ item.storage }}"
        state: running
      loop: "{{ customers }}"

    - name: Report the tenant fleet
      vergeio.vergeos.tenant_info:
      register: fleet

    - name: Show fleet summary
      ansible.builtin.debug:
        msg: >-
          {{ item.name }}: {{ 'running' if item.running else 'stopped' }},
          {{ item.nodes | length }} node(s),
          {{ item.storage | map(attribute='provisioned_gb') | sum }} GB provisioned
      loop: "{{ fleet.tenants }}"
      loop_control:
        label: "{{ item.name }}"
