---
namespace: vergeio
name: vergeos
version: 2.1.0
readme: README.md
authors:
  - VergeIO
description: Ansible collection for managing VergeOS virtualization infrastructure
license:
  - GPL-3.0-or-later
license_file: ""
tags:
  - vergeio
  - vergeos
  - virtualization
  - infrastructure
  - cloud
repository: https://github.com/verge-io/ansible-vergeos
documentation: https://github.com/verge-io/ansible-vergeos
homepage: https://verge.io
issues: https://github.com/verge-io/ansible-vergeos/issues
build_ignore:
  - .git
  - .gitignore
  - .DS_Store
  - .claude
  - .mcp.json
  - CLAUDE.md
  - "*.tar.gz"
  - __pycache__
  - "*.pyc"
  - .venv
  # fnmatch against the path relative to the collection root: no path is ever
  # equal to "tests/", so the trailing slash made this entry match nothing and
  # the whole test tree shipped in every artifact (57 entries on 2.0.1). The
  # neighbouring entries work because none of them has one. See issue #15.
  - tests
  # ansible-galaxy does NOT read .gitignore, so anything gitignored but absent
  # from build_ignore is published whenever the artifact is built from a
  # working tree rather than a clean clone.
  - .probe
  - .pytest_cache
  - .github
  - .ansible-lint
