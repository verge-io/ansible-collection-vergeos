---
namespace: vergeio
name: vergeos
version: 2.0.0
readme: README.md
authors:
  - VergeIO
description: Ansible collection for managing VergeOS virtualization infrastructure
license:
  - GPL-3.0-or-later
license_file: ''
tags:
  - vergeio
  - vergeos
  - virtualization
  - infrastructure
  - cloud
repository: https://github.com/verge-io/ansible-vergeos
documentation: https://github.com/verge-io/ansible-vergeos
homepage: https://verge.io
issues: https://github.com/verge-io/ansible-vergeos/issues
build_ignore:
  - .git
  - .gitignore
  - .DS_Store
  - .claude
  - .mcp.json
  - CLAUDE.md
  - '*.tar.gz'
  - __pycache__
  - '*.pyc'
  - .venv
  # No trailing slashes. build_ignore is fnmatch against the path relative to
  # the collection root, so 'tests/' matches nothing and shipped the whole
  # test tree (151 entries) until this was corrected.
  - tests
  # Gitignored, but build_ignore does not read .gitignore, so these shipped
  # whenever the artifact was built from a working tree rather than a clean
  # clone.
  - .probe
  - .pytest_cache
