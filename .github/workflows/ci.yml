---
# CI for vergeio.vergeos.
#
# This repository had no workflow of any kind until this file: `.github/` was
# absent on every branch and in every commit, and `main`'s branch protection
# required a review but zero status checks. The unit suite was red on `main`
# for weeks (#66) and nothing surfaced it, because the only way to see it was
# to run pytest locally.
#
# See issue #66 and the Wave 0 section of the PR plan.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The collection MUST live at ansible_collections/<ns>/<name> for both
  # ansible-test and the module import paths used by the unit tests.
  COLLECTION_PATH: ansible_collections/vergeio/vergeos

jobs:
  units:
    name: units (ansible-core ${{ matrix.ansible }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor declared by meta/runtime.yml (requires_ansible >=2.15.0).
          - ansible: "2.15"
            python: "3.11"
          # What the collection is currently developed against.
          - ansible: "2.20"
            python: "3.12"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible }} and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core~=${{ matrix.ansible }}.0"
          python -m pip install pytest pytest-mock
          # pyvergeos is a hard runtime requirement. Install it so the tests
          # exercise the real exception classes rather than a stub -- see the
          # mock_pyvergeos fixture in tests/unit/conftest.py.
          python -m pip install -r ${{ env.COLLECTION_PATH }}/requirements.txt

      - name: Run unit tests
        working-directory: ${{ env.COLLECTION_PATH }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/unit -v

  sanity:
    name: sanity (ansible-core ${{ matrix.ansible }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ansible-test refuses to run under a Python its own core does not
        # support, and it is the CONTROLLER Python that matters here:
        #
        #   ansible-core 2.15 + py3.12
        #     -> "This version of ansible-test cannot be executed with Python
        #         version 3.12.14. Supported Python versions are: 3.9, 3.10,
        #         3.11"
        #
        # So the Python is pinned per core rather than shared across the
        # matrix. Keep these pairs in step when the floor moves.
        include:
          - ansible: "2.15"
            python: "3.11"
          - ansible: "2.20"
            python: "3.12"
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core~=${{ matrix.ansible }}.0"

      - name: Run ansible-test sanity
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test sanity --local -v --color

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-lint

      - name: Run ansible-lint
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-lint --profile production

  examples:
    name: examples parse
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      # Nothing in CI has ever run a shipped example, in any mode. That gap is
      # named in issue #28 and it is how six roles came to abort under --check.
      #
      # This is the half that runs without a cluster: every example must be a
      # playbook ansible can actually load, against the collection as built.
      # It does NOT catch #28 -- only a real --check run against a live system
      # does, and tests/unit/test_role_check_mode.py is what catches that
      # offline. Two different gaps, two different checks.
      - name: Every shipped example parses against the built collection
        working-directory: ${{ env.COLLECTION_PATH }}
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: |
          set -e
          shopt -s nullglob
          found=0
          for playbook in examples/*.yml; do
            found=1
            echo "::group::$playbook"
            ansible-playbook --syntax-check "$playbook"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no examples were found -- the sweep is checking nothing" >&2
            exit 1
          fi

  build:
    name: galaxy build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection
        uses: actions/checkout@v4
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Build the collection artifact
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-galaxy collection build --output-path ./dist

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-tarball
          path: ${{ env.COLLECTION_PATH }}/dist/*.tar.gz
          if-no-files-found: error
