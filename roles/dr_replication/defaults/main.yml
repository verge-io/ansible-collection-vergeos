---
# dr_replication -- site-to-site replication as code, plus an RPO watchdog.

# ── Connection ───────────────────────────────────────────────────────────────
dr_replication_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
dr_replication_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
dr_replication_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
dr_replication_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# ── Declared replication ─────────────────────────────────────────────────────
# List of outgoing syncs that should exist. Each entry takes the same keys as
# the vergeio.vergeos.site_sync module, minus the connection ones:
#
#   - name: to-dr-site                  # required
#     site: 1                           # required to CREATE
#     registration_code: "{{ vault_… }}" # required to CREATE; from the remote
#                                        # system's matching incoming sync
#     url: https://dr.example.com
#     enabled: true
#     encryption: true
#     compression: true
#     destination_tier: "4"
#     threads: 4
#
# Leave empty to run as a pure watchdog over whatever replication already
# exists — reconciliation is skipped entirely when nothing is declared, so a
# monitoring-only run cannot accidentally converge anything.
dr_replication_syncs: []

# Remove outgoing syncs that are NOT named in dr_replication_syncs.
#
# ⚠️ Off by default, and deliberately hard to turn on by accident. Deleting a
# sync tears down a replication relationship; adopt an existing estate with
# this false, confirm the report lists what you expect, and only then flip it.
# Ignored entirely when dr_replication_syncs is empty, so a watchdog run can
# never purge.
dr_replication_exact: false

# ── RPO watchdog ─────────────────────────────────────────────────────────────
# Seconds since a sync's last run beyond which it counts as behind. A sync
# that has NEVER run is always counted — a replication target configured once
# and never exercised is the failure this exists to surface.
#
# Default 24h. Set to 0 to skip the staleness check.
dr_replication_max_age: 86400

# Which direction the watchdog looks at. Incoming syncs are reported but never
# reconciled: an incoming sync belongs to the system that receives, and this
# role only ever holds credentials for one side.
dr_replication_watch: both

# Fail the play when a sync is behind RPO or unhealthy. Off by default so the
# role can be used as a reporter; turn it on in CI or a scheduled gate.
dr_replication_fail_on_lag: false
dr_replication_fail_on_unhealthy: false

# ── On-demand replication ────────────────────────────────────────────────────
# Names of syncs to run now, after reconciliation. Use before a risky change
# so the DR copy is current. A sync already running is left alone rather than
# restarted, because restarting mid-flight discards its progress.
dr_replication_run_now: []

# Wait for a triggered sync to finish before returning.
dr_replication_wait: false
dr_replication_wait_timeout: 7200
dr_replication_poll_interval: 30
