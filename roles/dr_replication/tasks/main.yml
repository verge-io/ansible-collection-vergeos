---
# dr_replication -- reconcile site-to-site replication, then check it is
# actually keeping up.
#
# Two jobs that belong together: declaring replication and proving it works.
# A sync that exists and is enabled tells you nothing — the failure mode this
# role is built around is a replication target that was configured once, looks
# correct in the UI, and has not moved data in weeks.

- name: Preflight -- declared syncs must be named
  ansible.builtin.assert:
    that:
      - dr_replication_syncs | rejectattr('name', 'defined') | list | length == 0
      - dr_replication_host | length > 0
    fail_msg: >-
      every entry in dr_replication_syncs needs a name, and
      dr_replication_host (or VERGEOS_HOST) must be set.
    quiet: true

# ── Reconcile ────────────────────────────────────────────────────────────────
# Skipped entirely when nothing is declared, so a watchdog-only run cannot
# converge anything by accident.
- name: Reconcile declared replication
  when: dr_replication_syncs | length > 0
  block:
    - name: Ensure each declared sync exists and matches
      vergeio.vergeos.site_sync:
        host: "{{ dr_replication_host }}"
        username: "{{ dr_replication_username }}"
        password: "{{ dr_replication_password }}"
        insecure: "{{ dr_replication_insecure }}"
        name: "{{ item.name }}"
        site: "{{ item.site | default(omit) }}"
        registration_code: "{{ item.registration_code | default(omit) }}"
        url: "{{ item.url | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        enabled: "{{ item.enabled | default(omit) }}"
        encryption: "{{ item.encryption | default(omit) }}"
        compression: "{{ item.compression | default(omit) }}"
        netinteg: "{{ item.netinteg | default(omit) }}"
        threads: "{{ item.threads | default(omit) }}"
        file_threads: "{{ item.file_threads | default(omit) }}"
        destination_tier: "{{ item.destination_tier | default(omit) }}"
        queue_retry_count: "{{ item.queue_retry_count | default(omit) }}"
        queue_retry_interval: "{{ item.queue_retry_interval | default(omit) }}"
        queue_retry_multiplier: "{{ item.queue_retry_multiplier | default(omit) }}"
        note: "{{ item.note | default(omit) }}"
      loop: "{{ dr_replication_syncs }}"
      loop_control:
        label: "{{ item.name }}"
      register: dr_replication_reconciled

    - name: Remove replication that is not declared
      ansible.builtin.include_tasks: purge.yml
      when: dr_replication_exact | bool

# ── Run on demand ────────────────────────────────────────────────────────────

- name: Replicate now
  vergeio.vergeos.site_sync:
    host: "{{ dr_replication_host }}"
    username: "{{ dr_replication_username }}"
    password: "{{ dr_replication_password }}"
    insecure: "{{ dr_replication_insecure }}"
    name: "{{ item }}"
    state: started
  loop: "{{ dr_replication_run_now }}"
  loop_control:
    label: "{{ item }}"
  when: dr_replication_run_now | length > 0

- name: Wait for triggered replication to finish
  ansible.builtin.include_tasks: wait_sync.yml
  loop: "{{ dr_replication_run_now }}"
  loop_control:
    loop_var: dr_sync_name
  when:
    - dr_replication_run_now | length > 0
    - dr_replication_wait | bool

# ── Watchdog ─────────────────────────────────────────────────────────────────

- name: Read replication state
  vergeio.vergeos.site_sync_info:
    host: "{{ dr_replication_host }}"
    username: "{{ dr_replication_username }}"
    password: "{{ dr_replication_password }}"
    insecure: "{{ dr_replication_insecure }}"
    direction: "{{ dr_replication_watch }}"
    max_age: "{{ (dr_replication_max_age | int) or omit }}"
  register: dr_replication_state
  changed_when: false

- name: Report replication
  ansible.builtin.debug:
    msg:
      outgoing: >-
        {{ dr_replication_state.outgoing | default([])
           | map(attribute='name') | list }}
      incoming: >-
        {{ dr_replication_state.incoming | default([])
           | map(attribute='name') | list }}
      # Age of each outgoing sync's last run. A null here means the sync has
      # never run at all, which is why it is left as null rather than
      # defaulted to 0 -- "never" and "just now" must not look alike.
      lag_seconds: >-
        {{ dict(dr_replication_state.outgoing | default([])
                | map(attribute='name')
                | zip(dr_replication_state.outgoing | default([])
                      | map(attribute='seconds_since_last_run'))) }}
      behind_rpo: >-
        {{ dr_replication_state.stale | default([]) | map(attribute='name') | list }}
      unhealthy: >-
        {{ dr_replication_state.unhealthy | default([]) | map(attribute='name') | list }}

- name: Replication must be within the recovery point objective
  ansible.builtin.assert:
    that: dr_replication_state.stale | default([]) | length == 0
    fail_msg: >-
      replication is behind the {{ dr_replication_max_age }}s RPO:
      {{ dr_replication_state.stale | map(attribute='name') | list }}.
      A sync listed here with no age has never run at all.
    quiet: true
  when:
    - dr_replication_fail_on_lag | bool
    - dr_replication_max_age | int > 0

- name: Replication must be healthy
  ansible.builtin.assert:
    that: dr_replication_state.unhealthy | default([]) | length == 0
    fail_msg: >-
      the platform does not report these syncs as online and error-free:
      {{ dr_replication_state.unhealthy | map(attribute='name') | list }}.
      A sync whose state could not be read is counted here rather than
      assumed healthy.
    quiet: true
  when: dr_replication_fail_on_unhealthy | bool
