---
# Remove outgoing syncs that are not declared.
#
# Destructive, and gated behind dr_replication_exact for that reason: deleting
# a sync tears down a replication relationship. The snapshots already sitting
# on the remote system survive, but the pipe that keeps them current does not.

- name: List the replication that exists
  vergeio.vergeos.site_sync_info:
    host: "{{ dr_replication_host }}"
    username: "{{ dr_replication_username }}"
    password: "{{ dr_replication_password }}"
    insecure: "{{ dr_replication_insecure }}"
    direction: outgoing
  register: dr_replication_existing
  changed_when: false

- name: Work out what is not declared
  ansible.builtin.set_fact:
    dr_replication_stray: >-
      {{ dr_replication_existing.outgoing | default([])
         | rejectattr('name', 'in', dr_replication_syncs | map(attribute='name') | list)
         | map(attribute='name') | list }}

- name: Report what exact mode would remove
  ansible.builtin.debug:
    msg: >-
      {{ ("removing undeclared replication: " ~ dr_replication_stray)
         if dr_replication_stray | length > 0
         else "no undeclared replication" }}

- name: Remove undeclared replication
  vergeio.vergeos.site_sync:
    host: "{{ dr_replication_host }}"
    username: "{{ dr_replication_username }}"
    password: "{{ dr_replication_password }}"
    insecure: "{{ dr_replication_insecure }}"
    name: "{{ item }}"
    state: absent
  loop: "{{ dr_replication_stray }}"
  loop_control:
    label: "{{ item }}"
