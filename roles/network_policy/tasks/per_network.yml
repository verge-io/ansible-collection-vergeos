---
- name: "Stage rules on {{ policy.network }}"
  vergeio.vergeos.vnet_rule:
    host: "{{ network_policy_host }}"
    username: "{{ network_policy_username }}"
    password: "{{ network_policy_password }}"
    insecure: "{{ network_policy_insecure }}"
    network: "{{ policy.network }}"
    name: "{{ rule.name }}"
    state: "{{ rule.state | default('present') }}"
    direction: "{{ rule.direction | default('incoming') }}"
    rule_action: "{{ rule.rule_action | default('accept') }}"
    protocol: "{{ rule.protocol | default('any') }}"
    interface: "{{ rule.interface | default('auto') }}"
    source_ip: "{{ rule.source_ip | default(omit) }}"
    source_ports: "{{ rule.source_ports | default(omit) }}"
    destination_ip: "{{ rule.destination_ip | default(omit) }}"
    destination_ports: "{{ rule.destination_ports | default(omit) }}"
    target_ip: "{{ rule.target_ip | default(omit) }}"
    target_ports: "{{ rule.target_ports | default(omit) }}"
    enabled: "{{ rule.enabled | default(true) }}"
    log: "{{ rule.log | default(false) }}"
    statistics: "{{ rule.statistics | default(false) }}"
    order: "{{ rule.order | default(omit) }}"
    description: "{{ rule.description | default(omit) }}"
    apply: false
  loop: "{{ policy.rules }}"
  loop_control:
    loop_var: rule
    label: "{{ rule.name }}"
  register: network_policy_staged

- name: "List existing rules on {{ policy.network }} (exact mode)"
  vergeio.vergeos.vnet_rule_info:
    host: "{{ network_policy_host }}"
    username: "{{ network_policy_username }}"
    password: "{{ network_policy_password }}"
    insecure: "{{ network_policy_insecure }}"
    network: "{{ policy.network }}"
  register: network_policy_existing
  changed_when: false
  when: policy.exact | default(false)

# System rules are rejected before anything else: they are the
# platform's own, deleting one is not a policy decision the operator
# made, and an "exact" policy that silently removed them would break
# the network it was meant to secure.
- name: "Purge unmanaged rules on {{ policy.network }} (exact mode)"
  vergeio.vergeos.vnet_rule:
    host: "{{ network_policy_host }}"
    username: "{{ network_policy_username }}"
    password: "{{ network_policy_password }}"
    insecure: "{{ network_policy_insecure }}"
    network: "{{ policy.network }}"
    name: "{{ unmanaged_rule }}"
    state: absent
    apply: false
  loop: >-
    {{ (network_policy_existing.rules | default([]))
       | rejectattr('system_rule')
       | rejectattr('name', 'in', policy.rules | map(attribute='name') | list)
       | map(attribute='name') | list }}
  loop_control:
    loop_var: unmanaged_rule
  when: policy.exact | default(false)
  register: network_policy_purged

# Once, at the end, and only if something is pending. vnet_apply checks
# need_fw_apply itself, so a converged policy reports no change here.
- name: "Apply pending rule changes on {{ policy.network }}"
  vergeio.vergeos.vnet_apply:
    host: "{{ network_policy_host }}"
    username: "{{ network_policy_username }}"
    password: "{{ network_policy_password }}"
    insecure: "{{ network_policy_insecure }}"
    network: "{{ policy.network }}"
  register: network_policy_applied
