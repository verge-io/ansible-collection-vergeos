---
argument_specs:
  main:
    short_description: Firewall rules as code, per network
    description:
      - Takes a YAML policy document and enforces it against each named
        network's firewall rules.
      - Every rule is staged without applying, then the network is refreshed
        once, and only when something is actually pending. A fully converged
        policy is therefore a zero-change run rather than a refresh on every
        play.
      - Additive by default. Optional per-network C(exact) mode deletes
        non-system rules the policy does not name; system rules are never
        touched.
    author:
      - VergeIO (@vergeio)
    options:
      network_policy_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      network_policy_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      network_policy_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      network_policy_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
      network_policy_networks:
        description: One entry per network to enforce.
        type: list
        elements: dict
        default: []
        options:
          network:
            description: Name of the vnet.
            type: str
            required: true
          exact:
            description:
              - When true, non-system rules this policy does not name are
                deleted. Adopt an existing network with C(false) first and
                read what it reports before flipping this on.
            type: bool
            default: false
          rules:
            description:
              - The rules. C(name) is the idempotence key; the remaining
                fields fall through to the C(vnet_rule) module's defaults.
            type: list
            elements: dict
            required: true
