---
# Facts set by set_fact SURVIVE the role. Two include_role calls in one play
# share them, so without this reset the second run inherits the first run's
# `image_pipeline_built: true` and reports a rebuild that never happened --
# which is precisely the claim this role exists to never make.
- name: Reset per-run state
  ansible.builtin.set_fact:
    image_pipeline_built: false

- name: Preflight -- connection is configured
  ansible.builtin.assert:
    that: image_pipeline_host | length > 0
    fail_msg: "image_pipeline needs image_pipeline_host (or VERGEOS_HOST)."
    quiet: true

- name: Preflight -- a source image and a template name
  ansible.builtin.assert:
    that:
      - image_pipeline_src | length > 0
      - image_pipeline_template_name | length > 0
    fail_msg: >-
      image_pipeline needs image_pipeline_src and
      image_pipeline_template_name.
    quiet: true

- name: Preflight -- the source image exists
  ansible.builtin.stat:
    path: "{{ image_pipeline_src }}"
  register: image_pipeline_srcstat
  failed_when: not image_pipeline_srcstat.stat.exists

- name: Is the template already present?
  vergeio.vergeos.vm_info:
    host: "{{ image_pipeline_host }}"
    username: "{{ image_pipeline_username }}"
    password: "{{ image_pipeline_password }}"
    insecure: "{{ image_pipeline_insecure }}"
    name: "{{ image_pipeline_template_name }}"
  register: image_pipeline_existing
  changed_when: false

# An existing template is never rebuilt. Somebody's VMs were cloned
# from it; silently replacing it underneath them would be the worst
# kind of helpful. Version by name instead.
- name: Build, upload and import
  when: image_pipeline_existing.vms | default([]) | length == 0
  block:
    # First, and deliberately first: this is the writing task the rest of
    # the build hangs off, and `tempfile` does not support check mode, so
    # being skipped is how the role learns it must not build anything.
    #
    # Gating on that rather than on `ansible_check_mode`, which reports the
    # --check FLAG and nothing else: a caller wrapping this role in a
    # `check_mode: true` block would get a false reading and the build would
    # go ahead. Same evidence-not-flags rule as vm_from_recipe and
    # tier_policy.
    #
    # Before this, a --check run did not skip cleanly. It died inside
    # Ansible's own templating:
    #
    #   Error while resolving value for 'argv' ...
    #   object of type 'dict' has no attribute 'path'
    #
    # because the tempfile was skipped and the next task templated
    # image_pipeline_work.path anyway.
    - name: Working directory
      ansible.builtin.tempfile:
        state: directory
        suffix: image-pipeline
      register: image_pipeline_work

    - name: What the pipeline would build (check mode)
      ansible.builtin.debug:
        msg: >-
          check mode: would pack {{ image_pipeline_src }} into
          {{ image_pipeline_media_name }}, upload it, and import it as
          '{{ image_pipeline_template_name }}'
          ({{ image_pipeline_cores }} core(s),
          {{ image_pipeline_ram_mb }} MB). Nothing was built.
      when: image_pipeline_work.path is not defined

    - name: Build it
      when: image_pipeline_work.path is defined
      block:
        # Read-only. check_mode: false is redundant under the gate above
        # and correct on its own terms, which is the point -- the guard in
        # tests/unit/test_role_check_mode.py reads the task, not the gate
        # (#28).
        - name: Read the image's virtual size
          ansible.builtin.command:
            argv: [qemu-img, info, --output=json, "{{ image_pipeline_src }}"]
          register: image_pipeline_qinfo
          changed_when: false
          check_mode: false

        - name: Stage the disk under the template name
          ansible.builtin.command:
            argv: [cp, --reflink=auto, "{{ image_pipeline_src }}",
                   "{{ image_pipeline_work.path }}/{{ image_pipeline_template_name }}.qcow2"]
          changed_when: true

        # No NICs in the OVF on purpose. A golden template that carries a
        # network binding drags it into every clone.
        - name: Render the OVF
          ansible.builtin.template:
            src: golden.ovf.j2
            dest: "{{ image_pipeline_work.path }}/{{ image_pipeline_template_name }}.ovf"
            mode: "0644"
          vars:
            template_name: "{{ image_pipeline_template_name }}"
            template_cores: "{{ image_pipeline_cores }}"
            template_ram_mb: "{{ image_pipeline_ram_mb }}"
            template_os_family: "{{ image_pipeline_os_family }}"
            _image_bytes: "{{ image_pipeline_srcstat.stat.size }}"
            _image_virtual_bytes: >-
              {{ (image_pipeline_qinfo.stdout | from_json)['virtual-size'] }}

        # OVF first, then the disk. The order is part of the OVA format,
        # not a preference.
        - name: Pack the OVA
          ansible.builtin.command:
            argv: [tar, -C, "{{ image_pipeline_work.path }}", -cf,
                   "{{ image_pipeline_work.path }}/{{ image_pipeline_media_name }}",
                   "{{ image_pipeline_template_name }}.ovf",
                   "{{ image_pipeline_template_name }}.qcow2"]
          changed_when: true

        - name: Upload to the media catalog
          vergeio.vergeos.file:
            host: "{{ image_pipeline_host }}"
            username: "{{ image_pipeline_username }}"
            password: "{{ image_pipeline_password }}"
            insecure: "{{ image_pipeline_insecure }}"
            name: "{{ image_pipeline_media_name }}"
            src: "{{ image_pipeline_work.path }}/{{ image_pipeline_media_name }}"
            state: present

        - name: Import as the template VM
          vergeio.vergeos.vm_import:
            host: "{{ image_pipeline_host }}"
            username: "{{ image_pipeline_username }}"
            password: "{{ image_pipeline_password }}"
            insecure: "{{ image_pipeline_insecure }}"
            name: "{{ image_pipeline_template_name }}"
            ova_file_name: "{{ image_pipeline_media_name }}"
            preserve_drive_format: true
            poll_timeout: "{{ image_pipeline_import_timeout }}"
            state: present

        - name: Enforce the template specs
          vergeio.vergeos.vm:
            host: "{{ image_pipeline_host }}"
            username: "{{ image_pipeline_username }}"
            password: "{{ image_pipeline_password }}"
            insecure: "{{ image_pipeline_insecure }}"
            name: "{{ image_pipeline_template_name }}"
            cpu_cores: "{{ image_pipeline_cores }}"
            ram: "{{ image_pipeline_ram_mb }}"
            os_family: "{{ image_pipeline_os_family }}"
            state: stopped

        - name: The build produced the template
          ansible.builtin.set_fact:
            image_pipeline_built: true

  always:
    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ image_pipeline_work.path }}"
        state: absent
      when: image_pipeline_work.path is defined

# Both of these are skipped when the build did not run and the template was
# not already there -- there is nothing to snapshot in check mode, and
# asking would fail on a VM that does not exist.
- name: Snapshot the template
  when: image_pipeline_existing.vms | default([]) | length > 0
        or image_pipeline_built | default(false)
  block:
    - name: Existing snapshots of the template
      vergeio.vergeos.vm_snapshot:
        host: "{{ image_pipeline_host }}"
        username: "{{ image_pipeline_username }}"
        password: "{{ image_pipeline_password }}"
        insecure: "{{ image_pipeline_insecure }}"
        vm_name: "{{ image_pipeline_template_name }}"
        operation: list
      register: image_pipeline_snaps
      changed_when: false

    - name: Ensure the golden snapshot
      vergeio.vergeos.vm_snapshot:
        host: "{{ image_pipeline_host }}"
        username: "{{ image_pipeline_username }}"
        password: "{{ image_pipeline_password }}"
        insecure: "{{ image_pipeline_insecure }}"
        vm_name: "{{ image_pipeline_template_name }}"
        snapshot_name: "{{ image_pipeline_snapshot_name }}"
        operation: create
      when: >-
        image_pipeline_snapshot_name not in
        (image_pipeline_snaps.snapshots | default([])
         | map(attribute='name') | list)

# `created` reports what this run DID, not what it found. A check-mode run
# finds no template and builds none, and saying "created: true" there would
# make the fact a statement about the cluster's contents rather than about
# the run -- which is what a caller keys off to decide whether to publish.
- name: Pipeline result
  ansible.builtin.set_fact:
    image_pipeline_result:
      template: "{{ image_pipeline_template_name }}"
      media: "{{ image_pipeline_media_name }}"
      created: "{{ image_pipeline_built | default(false) }}"
      already_present: "{{ image_pipeline_existing.vms
                           | default([]) | length > 0 }}"

- name: Summary
  ansible.builtin.debug:
    msg: >-
      template '{{ image_pipeline_template_name }}'
      {{ 'imported from ' ~ image_pipeline_src
         if image_pipeline_result.created
         else ('already present -- zero-change run'
               if image_pipeline_result.already_present
               else 'not built -- check mode') }};
      golden snapshot '{{ image_pipeline_snapshot_name }}'
      {{ 'ensured' if (image_pipeline_result.created
                       or image_pipeline_result.already_present)
         else 'not touched' }}.
