---
# k3s_node -- one Kubernetes node as a VM. Labelled honestly.
#
# VergeOS has no Tanzu or NKE equivalent. This is DIY Kubernetes that
# you operate: the role deploys ONE node per invocation, and a cluster
# is a playbook that runs it once per node with a shared token.
#
# It is not a managed service, and running it under Ansible does not
# make it one -- upgrades, etcd health and certificate rotation all
# stay yours.
#
# Same composition as lb_stack: golden template -> vm_clone ->
# rendered cloud-init -> nic -> boot. The k3s install itself needs
# guest internet access to get.k3s.io.

# Connection.
k3s_node_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
k3s_node_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
k3s_node_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
k3s_node_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# VM name and the golden template to clone. Both required.
k3s_node_name: ""
k3s_node_template: ""

k3s_node_snapshot: golden
k3s_node_network: External
k3s_node_cpu_cores: 2
k3s_node_ram_mb: 2048

# Renderer spec. Schema lives in files/k3s_render.py:
#   role          server | agent   (required)
#   token         shared cluster token -- from a vault, not a file
#   hostname      node hostname
#   server_url    required for agents
#   version       k3s version pin
#   tls_sans      extra TLS SANs (servers)
#   disable       components to disable (servers)
#   ssh_authorized_keys
#   phone_home    optional callback URL
k3s_node_spec: {}
