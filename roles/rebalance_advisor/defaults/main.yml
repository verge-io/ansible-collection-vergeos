---
# rebalance_advisor -- ADS-style hotspot remediation proposals.
#
# RECOMMEND-ONLY. The advisor never migrates anything. Applying a
# proposal is a human action, because a live migration is the one
# operation here whose blast radius is a running workload.
#
# A VM tagged `no-balance` in any tag category is never proposed for a
# move. Anti-affinity HA groups (those without a '+' prefix) are
# respected when choosing a target.

# Connection.
rebalance_advisor_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
rebalance_advisor_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
rebalance_advisor_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
rebalance_advisor_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# Sustained-hotspot thresholds, percent.
rebalance_advisor_cpu_threshold: 85
rebalance_advisor_ram_threshold: 85

# Maximum proposals per run. Small on purpose: this is remediation of a
# hotspot, not whole-cluster optimisation.
rebalance_advisor_max_moves: 2

# CPU sampling: N samples, S seconds apart, averaged. A single sample
# catches a spike and proposes a move that is not warranted.
rebalance_advisor_samples: 3
rebalance_advisor_interval: 5

# Optional: run the planner against a saved {nodes, vms} JSON instead of
# the live API. Used by the tests and the ladder.
rebalance_advisor_fixture: ""
