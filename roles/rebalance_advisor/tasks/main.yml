---
- name: Preflight -- connection is configured
  ansible.builtin.assert:
    that:
      - rebalance_advisor_fixture | length > 0
        or rebalance_advisor_host | length > 0
    fail_msg: >-
      rebalance_advisor needs rebalance_advisor_host (or VERGEOS_HOST),
      unless rebalance_advisor_fixture is set for an offline run.
    quiet: true

# Credentials go in the environment, not argv, so they stay out of a
# process listing and out of -vvv.
- name: Run the advisor
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, role_path ~ '/files/advisor.py',
          '--cpu-threshold', rebalance_advisor_cpu_threshold | string,
          '--ram-threshold', rebalance_advisor_ram_threshold | string,
          '--max-moves', rebalance_advisor_max_moves | string,
          '--samples', rebalance_advisor_samples | string,
          '--interval', rebalance_advisor_interval | string]
         + (['--fixture', rebalance_advisor_fixture]
            if rebalance_advisor_fixture else []) }}
  environment:
    VERGEOS_HOST: "{{ rebalance_advisor_host }}"
    VERGEOS_USERNAME: "{{ rebalance_advisor_username }}"
    VERGEOS_PASSWORD: "{{ rebalance_advisor_password }}"
    VERGEOS_INSECURE: "{{ 'true' if rebalance_advisor_insecure else '' }}"
  register: rebalance_advisor_raw
  changed_when: false
  no_log: true

- name: Parse the report
  ansible.builtin.set_fact:
    rebalance_advisor_result: "{{ rebalance_advisor_raw.stdout | from_json }}"

- name: Advisor summary
  ansible.builtin.debug:
    msg: >-
      {{ rebalance_advisor_result.hotspots | length }} hotspot(s),
      {{ rebalance_advisor_result.proposals | length }} proposal(s)
      [{{ rebalance_advisor_result.mode }}].
      {{ rebalance_advisor_result.notes | join(' | ') }}

# Printed one per line with the reason, because a proposal a human
# cannot evaluate is a proposal they will either rubber-stamp or ignore.
- name: Proposed moves -- applying one is a human decision
  ansible.builtin.debug:
    msg: "{{ item.reason }}"
  loop: "{{ rebalance_advisor_result.proposals }}"
  loop_control:
    label: "{{ item.vm }} -> {{ item.to_node }}"
