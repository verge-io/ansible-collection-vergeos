---
- name: Preflight -- connection is configured
  ansible.builtin.assert:
    that:
      - health_report_fixture | length > 0 or health_report_host | length > 0
    fail_msg: >-
      health_report needs health_report_host (or VERGEOS_HOST), unless
      health_report_fixture is set for an offline verdict run.
    quiet: true

- name: Preflight -- the gate value is one we understand
  ansible.builtin.assert:
    that: health_report_fail_on in ['', 'red', 'amber']
    fail_msg: >-
      health_report_fail_on must be '', 'red' or 'amber';
      got '{{ health_report_fail_on }}'.
    quiet: true

# Credentials go in the environment rather than argv so they never
# appear in a process listing or in -vvv output.
- name: Run the health scan
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, role_path ~ '/files/health_scan.py',
          '--capacity-amber', health_report_capacity_amber_pct | string,
          '--capacity-red', health_report_capacity_red_pct | string,
          '--snap-amber-hours', health_report_snapshot_amber_hours | string,
          '--snap-red-hours', health_report_snapshot_red_hours | string]
         + (['--fixture', health_report_fixture] if health_report_fixture else []) }}
  environment:
    VERGEOS_HOST: "{{ health_report_host }}"
    VERGEOS_USERNAME: "{{ health_report_username }}"
    VERGEOS_PASSWORD: "{{ health_report_password }}"
    VERGEOS_INSECURE: "{{ 'true' if health_report_insecure else '' }}"
  register: health_report_raw
  changed_when: false
  no_log: true

- name: Parse the report
  ansible.builtin.set_fact:
    health_report_result: "{{ health_report_raw.stdout | from_json }}"

- name: Digest
  ansible.builtin.debug:
    msg: "{{ health_report_result.digest }}"

- name: Check detail
  ansible.builtin.debug:
    msg: "[{{ item.verdict }}] {{ item.detail }}"
  loop: "{{ health_report_result.checks }}"
  loop_control:
    label: "{{ item.check }}"

- name: Post the digest to the webhook
  ansible.builtin.uri:
    url: "{{ health_report_webhook_url }}"
    method: POST
    body_format: json
    body:
      content: "{{ health_report_result.digest }}"
    status_code: [200, 204]
  when: health_report_webhook_url | length > 0
  changed_when: true

- name: Gate on verdict
  ansible.builtin.fail:
    msg: >-
      health gate ({{ health_report_fail_on }}):
      overall={{ health_report_result.overall }} -- {{ health_report_result.digest }}
  when: >-
    (health_report_fail_on == 'red' and health_report_result.overall == 'red')
    or (health_report_fail_on == 'amber'
        and health_report_result.overall in ['amber', 'red'])
