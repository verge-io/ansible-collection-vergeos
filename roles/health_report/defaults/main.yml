---
# health_report -- the daily-green watchdog.
#
# READ-ONLY. The scan never mutates anything.
#
# Doctrine: silence is the alert. Run this on a schedule with a webhook
# set, and the day the green digest stops arriving is itself the red
# flag. A check whose data cannot be read reports RED, never silently
# green -- a watchdog that fails quiet is worse than no watchdog.

# Connection. Env vars are the default source, but these are what the
# role actually uses, so a play can override them per-site.
health_report_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
health_report_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
health_report_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
health_report_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# Storage-tier utilization thresholds, percent of capacity used.
health_report_capacity_amber_pct: 80
health_report_capacity_red_pct: 90

# Cloud-snapshot recency. amber = a daily cadence plus slack,
# red = two missed dailies. Tune down if your profile snapshots hourly.
health_report_snapshot_amber_hours: 26
health_report_snapshot_red_hours: 50

# Optional webhook (Discord-compatible): POSTs {content: digest} after
# every run. Empty means no post.
health_report_webhook_url: ""

# Optional CI/cron gate:
#   ""      report only (default)
#   "red"   fail the play on red
#   "amber" fail on amber or red
health_report_fail_on: ""

# Optional: run the verdict logic against a saved state JSON instead of
# the live API. Used by the tests and by CI; the fixture carries its
# own 'now' so age checks are deterministic.
health_report_fixture: ""
