---
- name: Preflight -- connection is configured
  ansible.builtin.assert:
    that: protect_host | length > 0
    fail_msg: "protect needs protect_host (or VERGEOS_HOST)."
    quiet: true

- name: Preflight -- there are classes to reconcile
  ansible.builtin.assert:
    that: protect_classes | length > 0
    fail_msg: "protect_classes is empty -- nothing to reconcile."
    quiet: true

- name: Preflight -- the mode is one we understand
  ansible.builtin.assert:
    that: protect_mode in ['report', 'enforce']
    fail_msg: >-
      protect_mode must be 'report' or 'enforce';
      got '{{ protect_mode }}'.
    quiet: true

- name: Ensure the 'protect' tag category
  vergeio.vergeos.tag_category:
    host: "{{ protect_host }}"
    username: "{{ protect_username }}"
    password: "{{ protect_password }}"
    insecure: "{{ protect_insecure }}"
    name: protect
    taggable_vms: true
    state: present

- name: Ensure a tag per class
  vergeio.vergeos.tag:
    host: "{{ protect_host }}"
    username: "{{ protect_username }}"
    password: "{{ protect_password }}"
    insecure: "{{ protect_insecure }}"
    name: "{{ item.key }}"
    category: protect
    state: present
  loop: "{{ protect_classes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure a snapshot profile per class
  vergeio.vergeos.snapshot_profile:
    host: "{{ protect_host }}"
    username: "{{ protect_username }}"
    password: "{{ protect_password }}"
    insecure: "{{ protect_insecure }}"
    name: "{{ item.value.profile | default('protect-' ~ item.key) }}"
    description: "protect class '{{ item.key }}' (managed by the protect role)"
    periods: "{{ item.value.periods }}"
    state: present
  loop: "{{ protect_classes | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Scan VMs, tags and profile assignments
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}",
           "{{ role_path }}/files/protect_ctl.py", scan]
  environment:
    VERGEOS_HOST: "{{ protect_host }}"
    VERGEOS_USERNAME: "{{ protect_username }}"
    VERGEOS_PASSWORD: "{{ protect_password }}"
    VERGEOS_INSECURE: "{{ 'true' if protect_insecure else '' }}"
  register: protect_scan_raw
  changed_when: false
  # Read-only: protect_ctl.py scan only issues GETs. Without this the task is
  # skipped under --check, stdout is empty, and the next task hands '' to
  # from_json and aborts with a stack trace -- in a role whose whole default
  # mode is reporting, which is when someone reaches for --check (#28).
  #
  # `changed_when: false` is not the same claim. It says the task changes
  # nothing; this says it is safe to run anyway.
  check_mode: false
  no_log: true

- name: Parse the scan
  ansible.builtin.set_fact:
    protect_state: "{{ protect_scan_raw.stdout | from_json }}"

- name: Work out who needs enrolling, and who is orphaned
  ansible.builtin.set_fact:
    # Tagged with a class we know about, but not on that class's profile.
    protect_to_enroll: >-
      {%- set out = [] -%}
      {%- for vm in protect_state.vms if vm.protect_class in protect_classes -%}
        {%- set pname = protect_classes[vm.protect_class].profile
                        | default('protect-' ~ vm.protect_class) -%}
        {%- set pkey = protect_state.profiles.get(pname) -%}
        {%- if pkey is not none
               and (vm.snapshot_profile | string) != (pkey | string) -%}
          {%- set _ = out.append({'key': vm.key, 'name': vm.name,
                                  'class': vm.protect_class,
                                  'profile': pname, 'profile_key': pkey}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    # Carrying a profile this role manages, but no longer tagged.
    protect_orphans: >-
      {%- set managed = [] -%}
      {%- for cls, spec in protect_classes.items() -%}
        {%- set pname = spec.profile | default('protect-' ~ cls) -%}
        {%- if protect_state.profiles.get(pname) is not none -%}
          {%- set _ = managed.append(protect_state.profiles.get(pname) | string) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for vm in protect_state.vms
            if (vm.snapshot_profile | string) in managed
            and vm.protect_class is none -%}
        {%- set _ = out.append({'key': vm.key, 'name': vm.name,
                                'profile_field': vm.snapshot_profile}) -%}
      {%- endfor -%}
      {{ out }}

- name: Enforce -- enrol tagged VMs into their class profile
  vergeio.vergeos.vm:
    host: "{{ protect_host }}"
    username: "{{ protect_username }}"
    password: "{{ protect_password }}"
    insecure: "{{ protect_insecure }}"
    name: "{{ item.name }}"
    snapshot_profile: "{{ item.profile }}"
    state: present
  loop: "{{ protect_to_enroll }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.profile }}"
  when: protect_mode == 'enforce'

- name: Reconciliation summary
  ansible.builtin.set_fact:
    protect_result:
      mode: "{{ protect_mode }}"
      enrolled: "{{ protect_to_enroll if protect_mode == 'enforce' else [] }}"
      pending: "{{ protect_to_enroll if protect_mode != 'enforce' else [] }}"
      orphans: "{{ protect_orphans }}"

- name: Summary
  ansible.builtin.debug:
    msg: >-
      [{{ protect_mode }}]
      {{ protect_to_enroll | length }} VM(s)
      {{ 'enrolled' if protect_mode == 'enforce' else 'pending enrolment' }};
      {{ protect_orphans | length }} orphan(s) -- protected but untagged,
      report-only because removing protection is a human decision.

- name: Orphan detail
  ansible.builtin.debug:
    msg: >-
      orphan: {{ item.name }} still carries profile key
      {{ item.profile_field }}
  loop: "{{ protect_orphans }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fail on drift (report-mode CI gate)
  ansible.builtin.fail:
    msg: >-
      protection drift: {{ protect_to_enroll | length }} tagged VM(s) are
      not enrolled -- re-run with protect_mode=enforce.
  when:
    - protect_mode != 'enforce'
    - protect_fail_on_drift | bool
    - protect_to_enroll | length > 0
