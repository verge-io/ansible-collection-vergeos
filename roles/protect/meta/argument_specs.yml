---
argument_specs:
  main:
    short_description: Tag-driven snapshot-profile enrolment
    description:
      - Tag a VM C(protect/<class>) and this reconciler ensures the class's
        tag, its snapshot profile, and the VM's enrolment in that profile all
        exist. A new VM plus one tag is protected on the next run.
      - Report mode shows what would change and touches nothing, and can gate
        CI. Enforce mode performs the enrolment.
      - Orphans - a VM still carrying a managed profile but no longer tagged -
        are ALWAYS report-only. Adding protection is safe to automate;
        removing it is not.
    author:
      - VergeIO (@vergeio)
    options:
      protect_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      protect_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      protect_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      protect_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
      protect_classes:
        description:
          - The protection classes, keyed by class name. Each takes C(periods)
            for the snapshot profile, and optionally C(profile) to override
            the default profile name of C(protect-<class>).
        type: dict
        required: true
      protect_mode:
        description:
          - C(report) shows drift and changes nothing. C(enforce) enrols.
        type: str
        default: report
        choices: [report, enforce]
      protect_fail_on_drift:
        description:
          - In report mode, fail the play when a tagged VM is not enrolled.
        type: bool
        default: false
