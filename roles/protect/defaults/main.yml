---
# protect -- tag-driven protection enrolment.
#
# Tag a VM `protect/<class>` and the reconciler ensures its snapshot
# profile is that class's profile. New VM plus one tag equals protected
# on the next run, which is the point: protection stops being something
# somebody has to remember.
#
# Orphans -- a VM still carrying a managed profile but no longer tagged
# -- are ALWAYS report-only. Adding protection is safe to automate;
# removing it is not.

# Connection.
protect_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
protect_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
protect_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
protect_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# The protection classes.
#
#   protect_classes:
#     gold:
#       periods:
#         - {name: Hourly, frequency: hourly, retention: 86400, quiesce: true}
#         - {name: Daily,  frequency: daily,  retention: 604800, hour: 2}
#     bronze:
#       profile: custom-profile-name     # default: protect-<class>
#       periods:
#         - {name: Daily, frequency: daily, retention: 259200, hour: 3}
protect_classes: {}

# report  = show what would change, touch nothing.
# enforce = enrol tagged VMs into their class profile.
protect_mode: report

# Report-mode CI gate: fail when a tagged VM is not yet enrolled.
protect_fail_on_drift: false
