---
- name: Preflight -- connection is configured
  ansible.builtin.assert:
    that:
      - billing_export_fixture | length > 0
        or billing_export_host | length > 0
    fail_msg: >-
      billing_export needs billing_export_host (or VERGEOS_HOST), unless
      billing_export_fixture is set for an offline run.
    quiet: true

- name: Preflight -- a destination is set
  ansible.builtin.assert:
    that: billing_export_dest | length > 0
    fail_msg: "billing_export needs billing_export_dest."
    quiet: true

# changed_when: true because this genuinely writes files. It is the one
# task in this role that touches anything, and it touches only the
# controller's filesystem -- never the platform.
- name: Run the export
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python,
          role_path ~ '/files/billing_export.py',
          '--dest', billing_export_dest,
          '--periods', billing_export_periods | string]
         + (['--fixture', billing_export_fixture]
            if billing_export_fixture else []) }}
  environment:
    VERGEOS_HOST: "{{ billing_export_host }}"
    VERGEOS_USERNAME: "{{ billing_export_username }}"
    VERGEOS_PASSWORD: "{{ billing_export_password }}"
    VERGEOS_INSECURE: "{{ 'true' if billing_export_insecure else '' }}"
  register: billing_export_raw
  changed_when: true
  no_log: true

- name: Parse the summary
  ansible.builtin.set_fact:
    billing_export_result: "{{ billing_export_raw.stdout | from_json }}"

- name: Export summary
  ansible.builtin.debug:
    msg: >-
      {{ billing_export_result.system_rows }} system period(s),
      {{ billing_export_result.tenant_rows }} tenant row(s) ->
      {{ billing_export_result.files | join(', ') }}
