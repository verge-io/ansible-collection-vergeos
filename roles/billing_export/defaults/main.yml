---
# billing_export -- usage to CSV, for invoicing and chargeback.
#
# Read-only against the platform. Exports the system's own billing
# period records plus a per-tenant allocation snapshot, and writes two
# date-stamped CSVs. Point a schedule at it and ingest downstream.

# Connection.
billing_export_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
billing_export_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
billing_export_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
billing_export_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# Output directory, created if missing. Files are date-stamped:
#   vergeos-billing-system-YYYYMMDD.csv
#   vergeos-billing-tenants-YYYYMMDD.csv
billing_export_dest: "{{ lookup('env', 'HOME') }}/vergeos-billing"

# How many of the most recent system billing periods to include.
billing_export_periods: 12

# Emit every billing row the platform returns, including the superseded copy
# of a period. The platform genuinely returns the same period twice, differing
# only in the last second of `period_to`; billing off both double-counts the
# month (#27). Leave this off unless you are reconciling against the UI.
billing_export_keep_duplicate_periods: false

# Optional: build the CSVs from a saved {billing, tenants} JSON instead
# of the live API. Used by the tests.
billing_export_fixture: ""
