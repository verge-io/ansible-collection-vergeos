---
argument_specs:
  main:
    short_description: Prepare a platform update, prove N-1 capacity, then let the platform roll it
    description:
      - Runs the system-wide update lifecycle, checks that every node due a
        reboot has somewhere for its workloads to go, and then hands the roll
        to the platform's own rolling apply.
      - The reboots are not driven from here. The platform reboots nodes one
        at a time and migrates workloads first, and reimplementing that
        sequence means owning its race conditions - an earlier version of this
        role did, and treated C(maintenance=True) as "evacuation finished"
        when the platform sets it in under a second with RAM still resident.
      - What the platform does not do is refuse to start when the cluster
        cannot survive losing a node. It accepts the drain, flips the node to
        maintenance immediately, and then stalls mid-migration with no
        destination. That check, and verifying the cluster afterwards, is what
        this role adds.
      - Without O(rolling_update_confirm) set to C(yes) the role stages the
        update and reports what would be rebooted, but reboots nothing.
    author:
      - VergeIO (@vergeio)
    options:
      rolling_update_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      rolling_update_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      rolling_update_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      rolling_update_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
        default: false
      rolling_update_confirm:
        description:
          - Must be the literal string C(yes) before anything is rebooted.
          - A separate consent flag rather than relying on C(--check), because
            a scheduler will not remember to pass C(--check).
        type: str
        default: "no"
      rolling_update_stage:
        description:
          - How far to take the system-wide lifecycle before the roll. All
            three stages leave the cluster running.
        type: str
        choices: [checked, downloaded, installed]
        default: installed
      rolling_update_capacity_gate:
        description:
          - Refuse to start the roll when a node due a reboot has nowhere to
            evacuate to.
          - A node whose capacity could not be determined does not pass. "Could
            not tell" is not the same as "yes" for a gate whose job is to be
            certain.
        type: bool
        default: true
      rolling_update_force:
        description:
          - Permit nodes carrying workloads that cannot be migrated - GPU
            passthrough, for example - to reboot those workloads rather than
            stalling the roll.
          - Decides availability for those workloads, so it is never implied.
        type: bool
        default: false
      rolling_update_wait:
        description:
          - Wait for the roll to finish. The apply action returns when the
            roll is accepted, not when it completes, so without this the
            health gate would measure a cluster that has not started
            rebooting.
        type: bool
        default: true
      rolling_update_roll_timeout:
        description:
          - Seconds to allow the whole roll - every node down, back, and out
            of maintenance. A total, not per node.
        type: int
        default: 3600
      rolling_update_poll_interval:
        description: Seconds between polls.
        type: int
        default: 15
      rolling_update_health_gate:
        description:
          - Verify the cluster after the roll. The platform reports that it
            started the roll, not that the cluster survived it.
        type: bool
        default: true
      rolling_update_require_all_online:
        description:
          - Every node online before the run must be online again afterwards,
            compared against the baseline captured before anything changed.
        type: bool
        default: true
      rolling_update_settle_seconds:
        description:
          - Seconds to wait before evaluating the health gate. A node reports
            online before it is carrying anything.
        type: int
        default: 30
