---
# vm_from_recipe -- deploy a VM from a VergeOS recipe and wait for it to be
# usable. Every knob lives here.

# ── Connection ───────────────────────────────────────────────────────────────
vm_from_recipe_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
vm_from_recipe_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
vm_from_recipe_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
vm_from_recipe_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# ── What to deploy ───────────────────────────────────────────────────────────
# Recipe NAME as it appears in the catalog, matched exactly. Required.
vm_from_recipe_recipe: ""
# Catalog name. Supply it when two catalogs carry a recipe of the same name;
# without it an ambiguous name is refused rather than guessed.
vm_from_recipe_catalog: ""
# Name for the new VM. Required. Also the idempotence key: this role never
# re-deploys over an existing VM of this name.
vm_from_recipe_name: ""

# Question variable name -> value. Validated against the recipe's own question
# set, so an unknown name is an error rather than a silent no-op. Use
# vergeio.vergeos.vm_recipe_info to discover what a recipe accepts.
#
# Answer network questions EXPLICITLY. Defaults are not sent, on the grounds
# that the platform applies them -- for network questions it demonstrably does
# not, and the result is a VM whose NIC is attached to nothing while every
# other check passes. vm_from_recipe_verify_nics catches it either way.
vm_from_recipe_answers: {}

# Drop and report answers this recipe does not define instead of failing. For
# applying one answer set across recipes with differing question sets. Off by
# default, because with it on a typo silently vanishes.
vm_from_recipe_prune_unknown: false

# Update the instance when the recipe publishes a new version.
vm_from_recipe_auto_update: false

# ── Preflight ────────────────────────────────────────────────────────────────
# Run the server-side simulation before deploying. It renders cloud-init and
# walks every recipe step, creating nothing, and it is the only preflight a
# deploy has. Turning it off removes that.
vm_from_recipe_simulate: true
# Treat simulate hints -- unanswered questions whose default is empty -- as
# fatal. Off by default; they are reported either way.
vm_from_recipe_fail_on_hints: false

# ── Waiting ──────────────────────────────────────────────────────────────────
# Wait for the deploy to produce a VM row.
vm_from_recipe_wait: true
# ...and then wait for its drives to finish importing. Every stock cloud-image
# recipe builds its OS drive with media=import, and the VM row appears while
# that image is STILL DOWNLOADING. Without this the role reports success on a
# VM that cannot boot yet.
vm_from_recipe_wait_for_drives: true
# Budget for the import itself. An import legitimately takes minutes.
# A drive the platform has marked status=errors does not use this budget.
# vm_drive_info reports it on failed_drives and the wait exits on the next poll.
vm_from_recipe_wait_timeout: 1800
# Separate, much shorter budget for a drive ROW to appear at all. A recipe
# whose drive step failed produces a VM with no drives, ever -- and sharing one
# budget made such a VM burn the whole wait_timeout before failing.
vm_from_recipe_drive_grace: 120
# Seconds between polls. A load control, not a latency knob: polling faster
# does not make an image import finish sooner.
vm_from_recipe_poll_interval: 10

# ── Post-conditions ──────────────────────────────────────────────────────────
# Assert the VM has at least one drive, none still importing, and none the
# platform has marked failed (status=errors).
vm_from_recipe_verify_drives: true
# Assert every NIC is attached to a network.
vm_from_recipe_verify_nics: true

# ── Power ────────────────────────────────────────────────────────────────────
# Recipes leave the VM stopped. Power it on once the drives are ready.
#
# ⚠️ Off by default for a reason beyond taste -- but not the reason this
# comment used to give. It claimed the vm module's `enabled` parameter defaults
# to true and would therefore re-enable a VM someone had deliberately disabled.
# That is wrong twice over: `enabled` has no default in the argument spec (it
# defaults to true only on the CREATE path), and update_vm skips any field left
# unset. This role never passes it. Measured on 26.1.8:
#
#   state: running, enabled not passed  -> API error: Error starting machine:
#                                          Machine is disabled  (VM stays disabled)
#   state: running, enabled: true       -> re-enabled and started
#
# So a disabled VM is refused loudly rather than quietly re-enabled. It stays
# opt-in for the honest reason: on the CONVERGENCE path this starts a VM the
# role merely FOUND, and a machine someone stopped on purpose should not be
# started as a side effect of a deploy that had nothing to do.
vm_from_recipe_power_on: false
# How long to let an asynchronous power-on take before concluding the VM will
# not start. Power-on returns before the machine is running -- reading the
# status in the same breath as the request is a race, and it was a live one.
vm_from_recipe_power_on_grace: 120

# ── Boot proof ───────────────────────────────────────────────────────────────
# Prove the guest actually BOOTS, not merely that the VM was built correctly.
# Off by default: it needs the VM running, and it costs the minute or two a
# guest takes to come up. Every other check here passes on a VM sitting at
# "no bootable device"; this is the one that does not.
#
# The signal is guest disk WRITES. read_bytes and the NIC transmit counters
# both move off zero on a VM that never boots -- the firmware reads the boot
# sector and sends a few DHCP packets -- so neither is usable. See the notes on
# the vergeio.vergeos.vm_drive_info module for the measurements.
vm_from_recipe_verify_boot: false
# Budget for the guest to come up and write something. Generous: a small Linux
# guest writes within about 2.5 minutes of power-on, while Windows installing
# from an ISO is far slower.
vm_from_recipe_boot_timeout: 600

# ── Deliberately NOT implemented ─────────────────────────────────────────────
# There is no state: absent. Deleting a recipe instance does not delete the VM
# it created, so an "absent" that removed the instance would look like a
# teardown while leaving the VM running. Removing a VM stays an explicit act:
# use vergeio.vergeos.vm with state: absent.
