---
# Wait for the VM's drives to become usable.
#
# A recipe that builds its OS drive with media=import -- every stock
# cloud-image recipe does -- returns a VM row long before that drive is
# usable: the image is still downloading. Reporting success here would be a
# lie the caller acts on.
#
# Two phases, because the two things being waited for fail differently.

# Phase 1 asks "has a drive row appeared at all?". A recipe whose drive step
# failed produces a VM with none, ever -- so this gets its own short grace
# budget. Collapsing both waits into one condition made a driveless VM burn the
# ENTIRE wait_timeout and then fail with a bare attempt count instead of saying
# what was wrong.
- name: Wait for a drive row to appear
  vergeio.vergeos.vm_drive_info:
    host: "{{ vm_from_recipe_host }}"
    username: "{{ vm_from_recipe_username }}"
    password: "{{ vm_from_recipe_password }}"
    insecure: "{{ vm_from_recipe_insecure }}"
    vm: "{{ vm_from_recipe_name }}"
  register: vm_from_recipe_first_drives
  failed_when: false
  changed_when: false
  retries: "{{ (vm_from_recipe_drive_grace | int // (vm_from_recipe_poll_interval | int)) | int }}"
  delay: "{{ vm_from_recipe_poll_interval | int }}"
  until: vm_from_recipe_first_drives.drives | default([]) | length > 0

# Phase 2 asks "has the import finished?", which legitimately takes minutes
# and so gets the full budget.
#
# ⚠️ The condition is the module's `importing` list, NOT the absence of a
# status. Waiting for the absence of 'importing' is a race, and it fired: a
# freshly created drive row has not entered that state yet, so the very first
# poll was satisfied and the wait returned immediately while the image had not
# begun downloading. The verify step then read the drive moments later, found
# it importing, and reported a timeout that had never happened.
#
# The module folds both signals together -- media=import is the drive the
# platform has not finished building, status=importing is the moment it is
# actively pulling, and a drive can be the first without yet being the second.
#
# A drive the platform has given up on is not still importing. On 26.1.8 a
# failed cloud-image download is status 'errors' within about two seconds,
# media stays 'import', and the row never changes. Counting that as unfinished
# made this wait burn the whole budget and then advise raising it.
# vm_drive_info leaves those drives out of `importing` and lists them on
# `failed_drives`, and this until exits as soon as one appears. The verdict is
# still verify_vm.yml, which quotes the platform's status_info.
- name: Wait for drive imports to finish
  vergeio.vergeos.vm_drive_info:
    host: "{{ vm_from_recipe_host }}"
    username: "{{ vm_from_recipe_username }}"
    password: "{{ vm_from_recipe_password }}"
    insecure: "{{ vm_from_recipe_insecure }}"
    vm: "{{ vm_from_recipe_name }}"
  register: vm_from_recipe_drives
  # Neither poll is the verdict -- verify_vm.yml is, and it can say "created
  # with no drives, it cannot boot", or name the drive and quote the platform's
  # own download percentage, where a timed-out poll can only say how many times
  # it tried.
  failed_when: false
  changed_when: false
  retries: "{{ (vm_from_recipe_wait_timeout | int // (vm_from_recipe_poll_interval | int)) | int }}"
  delay: "{{ vm_from_recipe_poll_interval | int }}"
  until:
    - vm_from_recipe_drives.drives | default([]) | length > 0
    # Exit when the import is done, OR when a drive has already failed. The
    # second clause is what keeps a sibling that is still downloading from
    # holding a failed drive in this loop until the budget runs out.
    - >-
      (vm_from_recipe_drives.importing | default([]) | length == 0)
      or (vm_from_recipe_drives.failed_drives | default([]) | length > 0)
  when: vm_from_recipe_first_drives.drives | default([]) | length > 0

- name: Report drive readiness
  ansible.builtin.debug:
    msg: >-
      drives: {{ vm_from_recipe_drives.drives | default([])
                 | map(attribute='name') | list }};
      still importing: {{ vm_from_recipe_drives.importing | default([])
                          | map(attribute='name') | list }};
      failed: {{ vm_from_recipe_drives.failed_drives | default([])
                 | map(attribute='name') | list }}
