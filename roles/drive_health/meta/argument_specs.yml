---
argument_specs:
  main:
    short_description: Read-only SMART and vSAN drive triage
    description:
      - Reports which drives are failing, which are wearing out, and which are
        unsafe to pull right now because vSAN is rebuilding onto them.
      - Read-only by design. Every other decision in this collection is
        reversible; pulling a drive is not, so this role produces a
        replacement list and stops.
    author:
      - VergeIO (@vergeio)
    options:
      drive_health_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      drive_health_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      drive_health_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      drive_health_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
        default: false
      drive_health_node:
        description: Limit the scan to one node. Empty scans the cluster.
        type: str
        default: ""
      drive_health_critical_flags:
        description:
          - SMART flags that mean "replace this drive".
          - Defaults to the sector-failure attributes. On an all-flash tier
            where wear-out is the failure mode, add C(wear_level_warn).
        type: list
        elements: str
        default: [realloc_sectors_warn, current_pending_sector_warn, offline_uncorrectable_warn]
      drive_health_warning_flags:
        description: SMART flags that mean "watch this drive".
        type: list
        elements: str
        default: [wear_level_warn, temp_warn]
      drive_health_fail_on_critical:
        description: Fail the play when a drive needs replacing.
        type: bool
        default: false
      drive_health_fail_on_warning:
        description: Fail the play on warnings too. Noisier.
        type: bool
        default: false
