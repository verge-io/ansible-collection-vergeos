---
argument_specs:
  main:
    short_description: Drain a node into maintenance, or return it to service
    description:
      - Evacuates a node into maintenance mode, waiting for its running VMs to
        actually leave, or takes a node back out of maintenance.
      - The preflight is read-only and always runs. With
        C(node_drain_confirm) left at C(no) the role reports whether the drain
        would fit and stops.
      - Gates on N-1 capacity before draining. The platform accepts a drain it
        cannot complete - a measured drain with an 18 GB shortfall was
        accepted, flipped the node to maintenance immediately, and then sat at
        C(migrating) with no destination for fourteen minutes, with no error
        and no timeout.
    author:
      - VergeIO (@vergeio)
    options:
      node_drain_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      node_drain_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      node_drain_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      node_drain_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
      node_drain_node:
        description: Name of the node to act on.
        type: str
        required: true
      node_drain_state:
        description:
          - C(drained) evacuates the node into maintenance mode.
          - C(active) takes it back out.
        type: str
        default: drained
        choices: [drained, active]
      node_drain_confirm:
        description:
          - Must be the string C(yes) for the drain to actually run. Anything
            else runs the read-only preflight and stops.
        type: str
        default: "no"
      node_drain_force:
        description:
          - Drain even when the capacity gate says the workloads will not fit.
            This is how you reproduce the indefinite stall described above.
        type: bool
        default: false
      node_drain_timeout:
        description: Seconds to wait for the node's running VMs to leave.
        type: int
        default: 600
      node_drain_poll_interval:
        description: Seconds between completion polls.
        type: int
        default: 10
