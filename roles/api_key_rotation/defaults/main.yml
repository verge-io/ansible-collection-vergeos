---
# api_key_rotation -- zero-downtime bearer-key rotation.
#
# Generations are named "<key_name>-<suffix>". Each run:
#   1. creates the new generation,
#   2. PROVES the new secret authenticates with a live Bearer request,
#   3. only then deletes every older generation,
#   4. optionally writes the new secret to disk at 0600.
#
# Step 2 before step 3 is the whole design. A rotation that revokes the
# old credential before confirming the new one works is how automation
# locks itself out.

# Connection.
api_key_rotation_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
api_key_rotation_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
api_key_rotation_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
api_key_rotation_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# The user the key belongs to, and the logical key name. Both required.
api_key_rotation_user: ""
api_key_rotation_key_name: ""

# Metadata applied to the new generation.
api_key_rotation_description: "rotated by the api_key_rotation role"
api_key_rotation_ip_allow_list: []
api_key_rotation_ip_deny_list: []

# Where to write the new secret. Empty means do not persist -- callers
# can read api_key_rotation_secret from the role instead.
api_key_rotation_secret_dest: ""

# Generation suffix. Must be unique per rotation: two rotations inside
# the same second would collide, and the role refuses that loudly
# rather than silently reusing a generation.
api_key_rotation_suffix: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

# Verify the new secret with a live Bearer request before deleting the
# old generations. Turn this off ONLY where the controller cannot reach
# the API directly over HTTPS -- and understand that doing so removes
# the safety property this role exists for.
api_key_rotation_verify_bearer: true
