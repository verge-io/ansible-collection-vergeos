---
argument_specs:
  main:
    short_description: Audit and enforce storage-tier placement
    description:
      - Declares which storage tier each VM's drives belong on, using
        first-match-wins glob rules, and audits the configured
        C(preferred_tier) against that policy.
      - Report mode is read-only and can gate CI. Enforce mode corrects drift
        through the C(drive) module and then re-audits, because the platform
        accepts writes it silently discards and "the module said changed" is
        not evidence that anything moved.
      - Drives no rule matches are reported as C(unclassified) and never
        touched, unless C(tier_policy_default_tier) opts them in.
    author:
      - VergeIO (@vergeio)
    options:
      tier_policy_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
      tier_policy_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      tier_policy_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      tier_policy_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
      tier_policy_rules:
        description:
          - Placement rules, evaluated first-match-wins per drive. Each entry
            takes C(match) (a VM-name glob), an optional C(drive) glob to
            scope it to particular drives, and C(tier).
        type: list
        elements: dict
        default: []
      tier_policy_default_tier:
        description:
          - Tier for drives no rule matched. Leaving this unset reports them
            as C(unclassified) and leaves them alone.
          - Setting it makes every unmatched drive on the system subject to
            policy, which under enforce will retier VMs you never named.
        type: int
      tier_policy_mode:
        description:
          - C(report) audits only. C(enforce) corrects drift and re-audits.
        type: str
        default: report
        choices: [report, enforce]
      tier_policy_fail_on_drift:
        description: In report mode, fail the play when any drive is off policy.
        type: bool
        default: false
      tier_policy_fixture:
        description:
          - Path to a saved JSON document with C(drives). Audits offline
            instead of reading the live API. Enforce is refused against a
            fixture.
        type: str
        default: ""
