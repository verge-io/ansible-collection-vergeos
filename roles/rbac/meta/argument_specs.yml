---
argument_specs:
  main:
    short_description: Groups, membership and permissions from one document
    description:
      - Reconciles groups, who is in them, and what they can do.
      - Groups are created first, then membership, then rights - a permission
        attaches to an identity, and a group has no identity until it exists.
      - Additive by default. A partial document that silently revoked
        everything it did not mention would be destructive, and partial
        documents are the normal case while adopting an estate.
    author:
      - VergeIO (@vergeio)
    options:
      rbac_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      rbac_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      rbac_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      rbac_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
        default: false
      rbac_groups:
        description:
          - The document. One entry per group, with optional C(users),
            C(groups), C(exact_members) and C(permissions).
          - Each permission entry takes C(table), optional C(row) (0 means the
            whole table), and either C(rights) or C(full_control).
          - Rights are the whole grant, not an addition - a right not named is
            denied.
        type: list
        elements: dict
        default: []
      rbac_exact_permissions:
        description:
          - Revoke grants a managed group holds that the document does not
            declare. Groups absent from the document are untouched.
        type: bool
        default: false
      rbac_report:
        description: Print the resulting who-can-do-what after reconciling.
        type: bool
        default: true
