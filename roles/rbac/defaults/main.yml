---
# rbac -- groups, membership and permissions from one document.

# ── Connection ───────────────────────────────────────────────────────────────
rbac_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
rbac_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
rbac_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
rbac_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# ── The document ─────────────────────────────────────────────────────────────
# One entry per group. Everything except `name` is optional, so a document can
# manage membership without touching rights, or rights without touching
# membership.
#
#   - name: operators
#     description: Day-to-day VM operations
#     identifier: "<OIDC object id>"    # how an SSO group maps onto this one
#     users: [alice, bob]
#     groups: []                        # nested groups
#     exact_members: false              # remove anyone not listed
#     permissions:
#       - table: vms
#         rights: [list, read, create, modify]
#       - table: vnets
#         rights: [list, read]
#       - table: vms
#         row: 42                       # scope to one VM
#         rights: [list, read, modify]
#
# Rights are the WHOLE grant, not an addition: a right not named is denied.
# The five are list, read, create, modify, delete. `full_control: true` on a
# permission entry grants all five.
rbac_groups: []

# Remove permissions on tables NOT named for a group. Per-group
# `exact_members` does the same for membership.
#
# ⚠️ Off by default. A partial document that silently revoked everything it did
# not mention would be destructive, and partial documents are the normal case
# while adopting an estate. Adopt with this false, read the report, then flip.
rbac_exact_permissions: false

# ── Reporting ────────────────────────────────────────────────────────────────
# Print the resulting who-can-do-what after reconciling.
rbac_report: true
