---
# Revoke a group's grants that the document does not declare.
#
# Destructive, and gated behind rbac_exact_permissions. Scoped to the groups
# the document DOES name -- a group absent from the document is left entirely
# alone, so exact mode narrows rights within managed groups rather than
# purging the whole system.

- name: "Read current rights: {{ rbac_group.name }}"
  vergeio.vergeos.group_info:
    host: "{{ rbac_host }}"
    username: "{{ rbac_username }}"
    password: "{{ rbac_password }}"
    insecure: "{{ rbac_insecure }}"
    name: "{{ rbac_group.name }}"
    permissions: true
  register: rbac_current
  changed_when: false

- name: "Work out which grants are undeclared: {{ rbac_group.name }}"
  ansible.builtin.set_fact:
    # Matched on table AND row together, using the scope id group_info
    # already computes ("vms#0", "vms#42"). A table-level grant and a grant on
    # one row of the same table are DIFFERENT permissions, so comparing on the
    # table alone would let a declared row-level grant shelter an undeclared
    # table-wide one -- the direction that silently keeps too much access.
    #
    # Built with an explicit loop rather than map(attribute='row'): a declared
    # entry may omit row entirely, and map(attribute=) on a missing key does
    # not default, it fails.
    rbac_stray: >-
      {{ (rbac_current.groups | first).permissions | default([])
         | rejectattr('scope', 'in', rbac_declared) | list }}
  vars:
    rbac_declared: >-
      [{% for p in rbac_group.permissions | default([]) -%}
      "{{ p.table }}#{{ p.row | default(0) | int }}"{{ "," if not loop.last }}
      {%- endfor %}]

- name: "Report undeclared grants: {{ rbac_group.name }}"
  ansible.builtin.debug:
    msg: >-
      {{ ("revoking undeclared grants: "
          ~ (rbac_stray | map(attribute='scope') | list))
         if rbac_stray | length > 0
         else ("no undeclared grants for " ~ rbac_group.name) }}

- name: "Revoke undeclared grants: {{ rbac_group.name }}"
  vergeio.vergeos.permission:
    host: "{{ rbac_host }}"
    username: "{{ rbac_username }}"
    password: "{{ rbac_password }}"
    insecure: "{{ rbac_insecure }}"
    group: "{{ rbac_group.name }}"
    table: "{{ item.table }}"
    row: "{{ item.row | default(0) }}"
    state: absent
  loop: "{{ rbac_stray }}"
  loop_control:
    label: "{{ rbac_group.name }} -> {{ item.scope }}"
