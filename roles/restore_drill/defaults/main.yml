---
# restore_drill -- prove a snapshot actually restores and boots.
#
# Snapshot -> clone to a new name -> boot -> stability window ->
# verdict -> teardown. The source VM is never touched.
#
# This is the half of a backup strategy people skip. A backup you have
# never restored is a hypothesis.

# Connection.
restore_drill_host: "{{ lookup('env', 'VERGEOS_HOST') }}"
restore_drill_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
restore_drill_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
restore_drill_insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(false, true) | bool }}"

# VM to verify. Required.
restore_drill_vm: ""

# Name for the clone. Defaults to <vm>-drill.
restore_drill_clone_name: ""

# Take a fresh snapshot for the drill. false drills the newest
# existing snapshot instead, which is the more honest test of what
# your schedule is actually producing.
restore_drill_take_snapshot: true

# Name for the drill snapshot. Defaults to drill-<epoch>.
restore_drill_snapshot_name: ""

# The clone must stay running this long to pass. Short by default
# because the verdict is "it boots and stays up", not "the application
# is healthy" -- see the README.
restore_drill_boot_seconds: 30

# Networks whose NICs are disabled on the clone before boot. A VM with
# a static in-guest IP will collide with its own original if you boot
# a clone of it on the same network; list those networks here.
restore_drill_isolate_networks: []

# Leave the clone and/or the drill snapshot behind for inspection.
restore_drill_keep_clone: false
restore_drill_keep_snapshot: false
