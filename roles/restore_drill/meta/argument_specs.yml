---
argument_specs:
  main:
    short_description: Prove a snapshot actually restores and boots
    description:
      - Takes (or reuses) a snapshot, clones it to a new name, boots the
        clone, holds a stability window, and fails loudly if the clone does
        not stay running. Then removes the clone and the drill snapshot.
      - The source VM is never written to. The role refuses outright if the
        clone name resolves to the source name.
      - The verdict is "it booted and stayed up for N seconds". Application
        health is out of scope - layer a guest check on top where tools exist.
    author:
      - VergeIO (@vergeio)
    options:
      restore_drill_host:
        description: VergeOS hostname or IP. Defaults to C(VERGEOS_HOST).
        type: str
        required: true
      restore_drill_username:
        description: Username. Defaults to C(VERGEOS_USERNAME).
        type: str
      restore_drill_password:
        description: Password. Defaults to C(VERGEOS_PASSWORD).
        type: str
      restore_drill_insecure:
        description: Skip SSL validation. Defaults to C(VERGEOS_INSECURE).
        type: bool
      restore_drill_vm:
        description: Name of the VM to verify.
        type: str
        required: true
      restore_drill_clone_name:
        description: Name for the clone. Defaults to C(<vm>-drill).
        type: str
        default: ""
      restore_drill_take_snapshot:
        description:
          - Take a fresh snapshot for the drill. Setting this false drills the
            newest existing snapshot instead, which is the more honest test of
            what your schedule is actually producing.
        type: bool
        default: true
      restore_drill_snapshot_name:
        description: Name for the drill snapshot. Defaults to C(drill-<epoch>).
        type: str
        default: ""
      restore_drill_boot_seconds:
        description: How long the clone must stay running to pass.
        type: int
        default: 30
      restore_drill_isolate_networks:
        description:
          - Networks whose NICs are disabled on the clone before boot. A VM
            with a static in-guest IP will collide with its own original if a
            clone boots on the same network.
        type: list
        elements: str
        default: []
      restore_drill_keep_clone:
        description: Leave the clone behind for inspection.
        type: bool
        default: false
      restore_drill_keep_snapshot:
        description: Leave the drill snapshot behind.
        type: bool
        default: false
