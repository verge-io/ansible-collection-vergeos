---
# Create or delete the scratch network the firewall-rule ladders run against.
#
#   scratch_net_name    zz-prefixed name; refused otherwise
#   scratch_net_action  create | delete
#
# Why the OBJECT lifecycle is REST and not `vergeio.vergeos.network`:
# a fixture built out of the module under test cannot fail independently of
# it -- a `network` bug would read as a `vnet_rule` bug.
#
# Power is a different matter and is done with the module, which is the point
# of #97. It used to POST to vnet_actions here because nothing in the
# collection could power a vnet at all: `network` managed configuration only,
# while firewall rules need a RUNNING router before an apply does anything,
# so a play could stage a complete policy and had no way to make it live.
# `network` now takes state: running / stopped / restarted.
#
# This file replaced tests/live/scratch_net.py, which the ported ladders
# invoked and which is not in this repository. The script's stated reason
# ("the network module cannot create an addressed network -- finding #13") no
# longer holds; #13 is fixed, and now so is the power gap.

- name: "Fixture: refuse to touch anything not clearly scratch"
  ansible.builtin.assert:
    that: scratch_net_name is match('^zz-')
    fail_msg: "refusing to manage non-scratch network '{{ scratch_net_name }}'"
    quiet: true

- name: "Fixture: read the current networks"
  ansible.builtin.uri:
    url: "{{ scratch_api_base }}/vnets?fields=%24key,name"
    url_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
    url_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: scratch_net_rows
  changed_when: false

- name: "Fixture: note the key, if it exists"
  ansible.builtin.set_fact:
    # Forced to a string. The API returns $key as an int here and as a
    # string elsewhere on the same system, and `| length` on an int is a
    # runtime error rather than a falsy answer.
    scratch_net_key: >-
      {{ (scratch_net_rows.json | selectattr('name', 'equalto', scratch_net_name)
          | map(attribute='$key') | list | first | default('', true)) | string }}

- name: "Fixture: create"
  when:
    - scratch_net_action == 'create'
    - scratch_net_key | length == 0
  block:
    - name: "Fixture: POST the network"
      ansible.builtin.uri:
        url: "{{ scratch_api_base }}/vnets"
        url_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
        url_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        method: POST
        body_format: json
        body:
          name: "{{ scratch_net_name }}"
          type: internal
          network: "{{ scratch_net_cidr }}"
          ipaddress: "{{ scratch_net_ip }}"
          description: ansible live-verify scratch network (zz- disposable)
        status_code: [200, 201]
      register: scratch_net_created

    - name: "Fixture: note the new key"
      ansible.builtin.set_fact:
        scratch_net_key: "{{ scratch_net_created.json['$key'] | string }}"

# The module waits for the state and fails if it does not arrive, so the
# poll loop that used to live here is gone with the REST call it guarded.
- name: "Fixture: power on"
  when: scratch_net_action == 'create'
  vergeio.vergeos.network:
    name: "{{ scratch_net_name }}"
    state: running

- name: "Fixture: delete"
  when:
    - scratch_net_action == 'delete'
    - scratch_net_key | length > 0
  block:
    - name: "Fixture: power off"
      vergeio.vergeos.network:
        name: "{{ scratch_net_name }}"
        state: stopped

    - name: "Fixture: DELETE the network"
      ansible.builtin.uri:
        url: "{{ scratch_api_base }}/vnets/{{ scratch_net_key }}"
        url_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
        url_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        method: DELETE
        status_code: [200, 204, 404]
