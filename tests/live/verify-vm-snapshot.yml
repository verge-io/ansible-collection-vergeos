---
# Live ladder for vm_snapshot expiry (#119) and in-place restore (#128).
#
#   ansible-playbook verify-vm-snapshot.yml
#
# Create used to leave expires unset / treat expiration=0 as the SDK's 24h
# default, so a "golden" snapshot documented as never-expiring vanished the
# next day. Restore called snapshot.restore() (clone / wrong key) and always
# failed with a false "Snapshot not found".
#
# This ladder:
#   - creates a never-expiring snapshot and reads expires back as 0
#   - creates expiration:0 the same way
#   - creates a finite expiration and checks the stored epoch
#   - refuses a past epoch
#   - forwards description
#   - snapshots, mutates, restores in place, asserts the mutation is gone
#   - refuses restore while the VM is running
#   - refuses restore and delete of another VM's snapshot key (#161)
#   - tears down every zz-* it created
- name: VM snapshot live ladder
  hosts: localhost
  gather_facts: true
  vars:
    probe_vm: zz-snap-vm
    other_vm: zz-snap-vm-b
    never_name: zz-snap-never
    zero_name: zz-snap-zero
    finite_name: zz-snap-finite
    restore_name: zz-snap-restore
    cross_name: zz-snap-other
    finite_expires: "{{ (ansible_date_time.epoch | int) + 7200 }}"
  tasks:
    - name: "0. Nothing of these names is lying around"
      vergeio.vergeos.vm_info:
        insecure: true
      register: before
      changed_when: false
      failed_when: >-
        before.vms | selectattr('name', 'in', [probe_vm, other_vm])
        | list | length > 0

    - name: The ladder
      block:
        - name: "1. Create the probe VM, stopped"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ probe_vm }}"
            state: present
            cpu_cores: 1
            ram: 1024
            description: snap-base
          register: created

        # ── #119 expiry ────────────────────────────────────────────────

        - name: "2. Create with no expiration (docs: never)"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_name: "{{ never_name }}"
            description: qa never-expire
            operation: create
          register: never_create

        - name: "2b. Read it back from the API"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            operation: list
          register: listed
          changed_when: false

        - name: "2c. expires is 0 (never), description stuck"
          ansible.builtin.assert:
            that:
              - never_create is changed
              - never_create.expires | int == 0
              - never_create.snapshot_id | length > 0
              - >
                  (listed.snapshots
                   | selectattr('name', 'equalto', never_name)
                   | list | first).expires | int == 0
              - >
                  (listed.snapshots
                   | selectattr('name', 'equalto', never_name)
                   | list | first).description == 'qa never-expire'

        - name: "3. Create with expiration: 0 (also never)"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_name: "{{ zero_name }}"
            expiration: 0
            operation: create
          register: zero_create

        - name: "3b. List again"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            operation: list
          register: listed2
          changed_when: false

        - name: "3c. expires is 0 again"
          ansible.builtin.assert:
            that:
              - zero_create.expires | int == 0
              - >
                  (listed2.snapshots
                   | selectattr('name', 'equalto', zero_name)
                   | list | first).expires | int == 0

        - name: "4. Create with a future absolute epoch"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_name: "{{ finite_name }}"
            expiration: "{{ finite_expires | int }}"
            operation: create
          register: finite_create

        - name: "4b. List finite"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            operation: list
          register: listed3
          changed_when: false

        - name: "4c. Stored expires matches the epoch we sent"
          ansible.builtin.assert:
            that:
              - finite_create.expires | int == (finite_expires | int)
              - >
                  (listed3.snapshots
                   | selectattr('name', 'equalto', finite_name)
                   | list | first).expires | int
                  == (finite_expires | int)

        - name: "5. Past epoch is refused"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_name: zz-snap-past
            expiration: 1
            operation: create
          register: past
          failed_when: past is succeeded

        - name: "5b. Message names the rule"
          ansible.builtin.assert:
            that:
              - "'future Unix epoch' in past.msg"

        # ── #128 restore ───────────────────────────────────────────────

        - name: "6. Snapshot the base description"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_name: "{{ restore_name }}"
            description: restore probe
            operation: create
          register: restore_snap

        - name: "7. Mutate the VM away from the snapshot"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ probe_vm }}"
            state: present
            description: mutated-after-snap

        - name: "7b. Confirm the mutation landed"
          vergeio.vergeos.vm_info:
            insecure: true
            name: "{{ probe_vm }}"
          register: mutated
          changed_when: false
          failed_when: >-
            (mutated.vms | first).description != 'mutated-after-snap'

        - name: "8. Restore while running must fail (start first)"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ probe_vm }}"
            state: running
          register: started

        - name: "8b. In-place restore refused on a running VM"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ restore_snap.snapshot_id }}"
            operation: restore
          register: restore_running
          failed_when: restore_running is succeeded

        - name: "8c. Message says powered off"
          ansible.builtin.assert:
            that:
              - "'powered off' in restore_running.msg"

        - name: "9. Power off for the real restore"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ probe_vm }}"
            state: stopped

        - name: "9b. Check mode would restore"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ restore_snap.snapshot_id }}"
            operation: restore
          check_mode: true
          register: restore_check

        - name: "9c. Check mode reports changed, no restore yet"
          ansible.builtin.assert:
            that:
              - restore_check is changed
              - "'Would restore' in restore_check.msg"

        - name: "10. Restore in place"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ restore_snap.snapshot_id }}"
            operation: restore
          register: restored

        - name: "10b. Description is back to the snapshot state"
          vergeio.vergeos.vm_info:
            insecure: true
            name: "{{ probe_vm }}"
          register: after_restore
          changed_when: false
          failed_when: >-
            (after_restore.vms | first).description != 'snap-base'

        - name: "10c. Restore reported changed"
          ansible.builtin.assert:
            that:
              - restored is changed
              - restored.operation == 'restore'

        # ── #161 a snapshot key from another VM ────────────────────────
        # B owns the snapshot. Restore and delete name A. Both must fail
        # in check mode and for real, and B must stay on the mutation.

        - name: "11. Create a second stopped VM"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ other_vm }}"
            state: present
            cpu_cores: 1
            ram: 1024
            description: snap-b-base

        - name: "12. Snapshot B"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ other_vm }}"
            snapshot_name: "{{ cross_name }}"
            description: other vm snapshot
            operation: create
          register: other_snap

        - name: "13. Mutate B away from the snapshot"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ other_vm }}"
            state: present
            description: changed-after-snap

        - name: "13b. Confirm B changed"
          vergeio.vergeos.vm_info:
            insecure: true
            name: "{{ other_vm }}"
          register: other_mutated
          changed_when: false
          failed_when: >-
            (other_mutated.vms | first).description != 'changed-after-snap'

        - name: "14. Check mode restore of B's snapshot, named as A, must fail"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ other_snap.snapshot_id }}"
            operation: restore
          check_mode: true
          register: cross_check
          failed_when: cross_check is succeeded

        - name: "14b. Check-mode refusal names both VMs"
          ansible.builtin.assert:
            that:
              - probe_vm in cross_check.msg
              - other_vm in cross_check.msg

        - name: "15. Real restore of B's snapshot, named as A, must fail"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ other_snap.snapshot_id }}"
            operation: restore
          register: cross_run
          failed_when: cross_run is succeeded

        - name: "15b. Real refusal names both VMs"
          ansible.builtin.assert:
            that:
              - probe_vm in cross_run.msg
              - other_vm in cross_run.msg

        - name: "16. B was not reverted"
          vergeio.vergeos.vm_info:
            insecure: true
            name: "{{ other_vm }}"
          register: other_after
          changed_when: false
          failed_when: >-
            (other_after.vms | first).description != 'changed-after-snap'

        - name: "17. Check mode delete of B's snapshot, named as A, must fail"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ other_snap.snapshot_id }}"
            operation: delete
          check_mode: true
          register: cross_del_check
          failed_when: cross_del_check is succeeded

        - name: "18. Real delete of B's snapshot, named as A, must fail"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ probe_vm }}"
            snapshot_id: "{{ other_snap.snapshot_id }}"
            operation: delete
          register: cross_del
          failed_when: cross_del is succeeded

        - name: "18b. Delete refusal names both VMs"
          ansible.builtin.assert:
            that:
              - probe_vm in cross_del.msg
              - other_vm in cross_del.msg

        - name: "19. B's snapshot is still there"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ other_vm }}"
            operation: list
          register: other_listed
          changed_when: false

        - name: "19b. The snapshot key was not deleted"
          ansible.builtin.assert:
            that:
              - >
                  other_listed.snapshots
                  | selectattr('name', 'equalto', cross_name)
                  | list | length == 1

      always:
        - name: "T. List leftover snapshots on the probe VMs"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ item }}"
            operation: list
          loop:
            - "{{ probe_vm }}"
            - "{{ other_vm }}"
          register: leftover_snaps
          changed_when: false
          failed_when: false

        - name: "T. Delete each zz-snap-* we still see"
          vergeio.vergeos.vm_snapshot:
            insecure: true
            vm_name: "{{ item.0.item }}"
            snapshot_id: "{{ item.1['$key'] }}"
            operation: delete
          loop: >-
            {{ leftover_snaps.results | default([])
               | subelements('snapshots', skip_missing=True) }}
          when:
            - item.1.name is defined
            - item.1.name is match('^zz-snap-')
          failed_when: false

        - name: "T. Stop the probe VMs"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ item }}"
            state: stopped
          loop:
            - "{{ probe_vm }}"
            - "{{ other_vm }}"
          failed_when: false

        - name: "T. Delete the probe VMs"
          vergeio.vergeos.vm:
            insecure: true
            name: "{{ item }}"
            state: absent
          loop:
            - "{{ probe_vm }}"
            - "{{ other_vm }}"
          failed_when: false

    - name: "Z. Zero leftovers of our probe VM"
      vergeio.vergeos.vm_info:
        insecure: true
      register: after
      changed_when: false
      failed_when: >-
        after.vms | selectattr('name', 'in', [probe_vm, other_vm])
        | list | length > 0

    - name: PASSED
      ansible.builtin.debug:
        msg: >-
          vm_snapshot ladder PASSED: omitted expiration and expiration:0 both
          store expires=0 (never) -> a future epoch is stored as sent -> a past
          epoch is refused -> description is forwarded -> restore of a running
          VM is refused -> check mode would restore without doing it ->
          in-place restore reverts the mutation -> a snapshot key from the
          other VM is refused for restore and delete, and that VM stays
          changed -> zero leftovers
