---
# Live-verify ladder for tenant_network_block / tenant_external_ip
# (VergeOS 26.1.8). Uses a zz- scratch internal network (via
# scratch_net.py — the stock network module can't create addressed
# networks, finding #13) and a zz- scratch tenant, so nothing touches
# the real LAN. The tenant stays powered off throughout. Cleanup always
# runs, innermost resources first.
#
#   export VERGEOS_HOST=... VERGEOS_TOKEN=... VERGEOS_INSECURE=true
#   ansible-playbook verify-tenant-network.yml

- name: Tenant network live-verify ladder
  hosts: localhost
  gather_facts: false

  vars:
    net: zz-tenet
    tenant: zz-tenet-tenant
    block_cidr: 192.0.2.0/28
    ext_ip: 10.99.99.50

  tasks:
    - name: Ladder body
      block:
        - name: Scratch network (10.99.99.0/24, internal)
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", scratch_net.py, create, "{{ net }}"]
          changed_when: true

        - name: Scratch tenant (powered off, minimal)
          vergeio.vergeos.tenant:
            name: "{{ tenant }}"
            description: tenant-network ladder scratch (zz- disposable)
            state: present

        - name: "1. Assign a network block"
          vergeio.vergeos.tenant_network_block:
            tenant: "{{ tenant }}"
            network: "{{ net }}"
            cidr: "{{ block_cidr }}"
            description: ladder block
            state: present
          register: blk

        - name: "2. Identical re-run must converge"
          vergeio.vergeos.tenant_network_block:
            tenant: "{{ tenant }}"
            network: "{{ net }}"
            cidr: "{{ block_cidr }}"
            state: present
          register: blk_rerun

        - name: "Block verdicts: created once, converged, right CIDR"
          ansible.builtin.assert:
            that:
              - blk is changed
              - blk.network_block.cidr == block_cidr
              - blk_rerun is not changed
              - blk_rerun.network_block.key == blk.network_block.key
            fail_msg: "unexpected block results: {{ blk }} / {{ blk_rerun }}"

        - name: "3. Declaring the wrong source network must be refused"
          block:
            - name: Same block, network Core
              vergeio.vergeos.tenant_network_block:
                tenant: "{{ tenant }}"
                network: Core
                cidr: "{{ block_cidr }}"
                state: present

            - name: Unreachable — the refusal did not fire
              ansible.builtin.fail:
                msg: a moved block was silently accepted
          rescue:
            - name: Confirm the refusal names the remedy
              ansible.builtin.assert:
                that:
                  - "'cannot be moved' in (ansible_failed_result.msg | default(''))"
                fail_msg: "wrong failure: {{ ansible_failed_result | default({}) }}"

        - name: "4. Check-mode IP assignment must not create anything"
          vergeio.vergeos.tenant_external_ip:
            tenant: "{{ tenant }}"
            network: "{{ net }}"
            ip: "{{ ext_ip }}"
            state: present
          check_mode: true
          register: ip_preview

        - name: "5. Assign the external IP for real"
          vergeio.vergeos.tenant_external_ip:
            tenant: "{{ tenant }}"
            network: "{{ net }}"
            ip: "{{ ext_ip }}"
            hostname: zz-tenet-edge
            state: present
          register: ip_created

        - name: "6. Identical re-run must converge"
          vergeio.vergeos.tenant_external_ip:
            tenant: "{{ tenant }}"
            network: "{{ net }}"
            ip: "{{ ext_ip }}"
            state: present
          register: ip_rerun

        - name: "IP verdicts: previewed, created once with hostname, converged"
          ansible.builtin.assert:
            that:
              - ip_preview is changed
              - ip_created is changed
              - ip_created.external_ip.ip == ext_ip
              - ip_created.external_ip.hostname == 'zz-tenet-edge'
              - ip_rerun is not changed
            fail_msg: >-
              unexpected IP results:
              {{ ip_created }} / {{ ip_rerun }}

        - name: "7. Remove both assignments"
          vergeio.vergeos.tenant_external_ip:
            tenant: "{{ tenant }}"
            ip: "{{ ext_ip }}"
            state: absent
          register: ip_gone

        - name: Remove the block
          vergeio.vergeos.tenant_network_block:
            tenant: "{{ tenant }}"
            cidr: "{{ block_cidr }}"
            state: absent
          register: blk_gone

        - name: "8. Removal must be idempotent"
          vergeio.vergeos.tenant_network_block:
            tenant: "{{ tenant }}"
            cidr: "{{ block_cidr }}"
            state: absent
          register: blk_gone_again

        - name: "Removal verdicts"
          ansible.builtin.assert:
            that:
              - ip_gone is changed
              - blk_gone is changed
              - blk_gone_again is not changed
            fail_msg: "unexpected removal results"

        - name: Cleanup — tenant
          vergeio.vergeos.tenant:
            name: "{{ tenant }}"
            state: absent

        - name: Cleanup — scratch network
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", scratch_net.py, delete, "{{ net }}"]
          changed_when: true

      rescue:
        - name: Cleanup after failure — assignments first
          vergeio.vergeos.tenant_external_ip:
            tenant: "{{ tenant }}"
            ip: "{{ ext_ip }}"
            state: absent
          failed_when: false

        - name: Cleanup after failure — block
          vergeio.vergeos.tenant_network_block:
            tenant: "{{ tenant }}"
            cidr: "{{ block_cidr }}"
            state: absent
          failed_when: false

        - name: Cleanup after failure — tenant
          vergeio.vergeos.tenant:
            name: "{{ tenant }}"
            state: absent
          failed_when: false

        - name: Cleanup after failure — scratch network
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", scratch_net.py, delete, "{{ net }}"]
          changed_when: true
          failed_when: false

        - name: Ladder failed
          ansible.builtin.fail:
            msg: "rung failed: {{ ansible_failed_result | default({}) }}"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          tenant-network ladder PASSED: block assign -> converge ->
          move refusal -> IP check-mode -> assign -> converge ->
          removal x2 idempotent, zero leftovers
