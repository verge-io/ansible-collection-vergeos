[defaults]
inventory = localhost.ini
# Belt and braces with the ansible_python_interpreter pin in localhost.ini:
# use the interpreter running ansible-playbook rather than probing the system
# for one that may not have pyvergeos.
interpreter_python = auto_silent
# Point this at wherever the collection is built/installed.
# collections_path = /path/to/collections
host_key_checking = False
stdout_callback = default
