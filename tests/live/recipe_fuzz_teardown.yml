---
# Teardown helper for verify-recipe-fuzz.yml. Included twice: once at step 0,
# so a crashed previous run cannot poison this one, and once from the ladder's
# always: block.
#
# Everything here works by $key, through ansible.builtin.uri, and selects rows
# in Jinja rather than with an API filter. That is deliberate on two counts:
#
#   1. Cleanup must not depend on the code under test. This ladder exists to
#      attack name handling and filter escaping, so a teardown that looked its
#      objects up by name through the same path would fail to find exactly the
#      objects a defect had just mangled -- and leave them behind.
#   2. A refused OData filter does not error. It answers {"err": ...}, a
#      single-key mapping that reads as one result row, so a broken filter
#      here would delete nothing while reporting that it had.
#
# Sets fz_left_vms / fz_left_recipes / fz_left_cats for the caller to assert on.

# Recipes first: a recipe row references its source VM, so removing the VM
# while a recipe points at it leaves the recipe dangling.
- name: "Teardown: list recipes"
  ansible.builtin.uri:
    url: "{{ api_base }}/vm_recipes?fields=name%2C%24key"
  register: fz_td_recipes

- name: "Teardown: delete every zz-fuzz recipe"
  ansible.builtin.uri:
    url: "{{ api_base }}/vm_recipes/{{ item['$key'] }}"
    method: DELETE
    status_code: [200, 201, 202, 204, 404]
  loop: >-
    {{ fz_td_recipes.json | default([])
       | selectattr('name', 'defined')
       | selectattr('name', 'match', '^zz-fuzz') | list }}
  loop_control:
    label: "{{ item.name }} ({{ item['$key'] }})"

- name: "Teardown: list VMs"
  ansible.builtin.uri:
    url: "{{ api_base }}/vms?fields=name%2C%24key%2Cis_snapshot"
  register: fz_td_vms

- name: "Teardown: delete every zz-fuzz / zz-from-fuzz VM"
  ansible.builtin.uri:
    url: "{{ api_base }}/vms/{{ item['$key'] }}"
    method: DELETE
    status_code: [200, 201, 202, 204, 404]
  loop: >-
    {{ fz_td_vms.json | default([])
       | selectattr('name', 'defined')
       | rejectattr('is_snapshot')
       | selectattr('name', 'match', '^zz-(fuzz|from-fuzz)') | list }}
  loop_control:
    label: "{{ item.name }} ({{ item['$key'] }})"

- name: "Teardown: list catalogs"
  ansible.builtin.uri:
    url: "{{ api_base }}/catalogs?fields=name%2C%24key"
  register: fz_td_cats

- name: "Teardown: delete every zz-fuzz catalog"
  ansible.builtin.uri:
    url: "{{ api_base }}/catalogs/{{ item['$key'] }}"
    method: DELETE
    status_code: [200, 201, 202, 204, 404]
  loop: >-
    {{ fz_td_cats.json | default([])
       | selectattr('name', 'defined')
       | selectattr('name', 'match', '^zz-fuzz') | list }}
  loop_control:
    label: "{{ item.name }} ({{ item['$key'] }})"

# Re-read rather than trusting the deletes above: a DELETE that answers 200
# and removes nothing is the failure this is here to catch.
- name: "Teardown: re-read recipes"
  ansible.builtin.uri:
    url: "{{ api_base }}/vm_recipes?fields=name%2C%24key"
  register: fz_td_recipes2

- name: "Teardown: re-read VMs"
  ansible.builtin.uri:
    url: "{{ api_base }}/vms?fields=name%2C%24key"
  register: fz_td_vms2

- name: "Teardown: re-read catalogs"
  ansible.builtin.uri:
    url: "{{ api_base }}/catalogs?fields=name%2C%24key"
  register: fz_td_cats2

- name: "Teardown: record what is left"
  ansible.builtin.set_fact:
    fz_left_recipes: >-
      {{ fz_td_recipes2.json | default([]) | selectattr('name', 'defined')
         | selectattr('name', 'match', '^zz-fuzz')
         | map(attribute='name') | list }}
    fz_left_vms: >-
      {{ fz_td_vms2.json | default([]) | selectattr('name', 'defined')
         | selectattr('name', 'match', '^zz-(fuzz|from-fuzz)')
         | map(attribute='name') | list }}
    fz_left_cats: >-
      {{ fz_td_cats2.json | default([]) | selectattr('name', 'defined')
         | selectattr('name', 'match', '^zz-fuzz')
         | map(attribute='name') | list }}
