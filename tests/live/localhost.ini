[local]
# ansible_python_interpreter pins the interpreter to the one running
# ansible-playbook. Without it, naming an inventory host makes Ansible
# discover a system python (e.g. /usr/bin/python3.14) that has no pyvergeos
# installed, and every module fails with:
#
#   The pyvergeos SDK is required for this module.
#
# That bit six separate suites, including any ladder that shells out to a
# worker playbook. Playbooks run against implicit localhost were unaffected,
# which is why it looked intermittent.
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
