---
# Contract harness for the compare-and-map defect class -- issue #75.
#
#   ansible-playbook tests/live/verify-field-contract.yml
#
# Requires VERGEOS_HOST / VERGEOS_USERNAME / VERGEOS_PASSWORD in the
# environment and a system you are willing to create scratch objects on.
# Everything it creates is zz- prefixed and torn down in post_tasks.
#
# WHY THIS EXISTS
#
# The same defect has shipped four times -- #8, #10, #18, #59 -- because the
# VergeOS API accepts unknown field names with HTTP 200 and discards them.
# Nothing fails, the module reports changed=true, and the resource is wrong.
# No functional test catches that, because from the module's point of view
# everything worked.
#
# Three properties catch the class:
#
#   1. every field name the module sends exists on the resource
#   2. every documented parameter round-trips
#   3. a second apply reports changed=false
#
# Property 3 is the general one and would have caught all four on its own.
#
# THE LIST BELOW IS KEPT HONEST FROM BOTH ENDS
#
# tests/unit/plugins/modules/test_field_contracts.py asserts that
# network_api_fields matches plugins/modules/network.py's UPDATE_FIELD_MAP
# exactly, so this file cannot drift from the code. This ladder asserts the
# same names exist on a live vnet, so the code cannot drift from the API.
- name: "Field contract -- network"
  hosts: localhost
  gather_facts: false
  vars:
    net: zz-contract-net
    # MUST match network.UPDATE_FIELD_MAP.values() + UPLINK_API_FIELD.
    network_api_fields:
      - description
      - dhcp_enabled
      - dhcp_start
      - dhcp_stop
      - dnslist
      - domain
      - gateway
      - interface_vnet
      - ipaddress
      - layer2_id
      - layer2_type
      - mtu
      - network
      - on_power_loss
      - rate_limit
      - type
    auth: &auth
      host: "{{ lookup('env', 'VERGEOS_HOST') }}"
      username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
      password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
      insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true, true) }}"

  pre_tasks:
    - name: Clean start
      vergeio.vergeos.network:
        <<: *auth
        name: "{{ net }}"
        state: absent

  tasks:
    - name: Create a network exercising every mapped parameter
      vergeio.vergeos.network:
        <<: *auth
        name: "{{ net }}"
        state: present
        description: contract probe
        network_type: internal
        network: 10.99.60.0/24
        ip_address: 10.99.60.1
        gateway: 10.99.60.254
        dhcp_enabled: true
        dhcp_start: 10.99.60.100
        dhcp_end: 10.99.60.200
        dns_servers: ["9.9.9.9"]
        domain: contract.test
        mtu: 1500
        rate_limit: 50
        on_power_loss: last_state
      register: created

    - name: Read it back with the full field set
      vergeio.vergeos.network_info:
        <<: *auth
        name: "{{ net }}"
      register: probe

    # ---- PROPERTY 1 -------------------------------------------------------
    - name: "PROPERTY 1 -- every API field the module sends exists on the resource"
      ansible.builtin.assert:
        that: item in probe.networks[0]
        fail_msg: >-
          The network module sends '{{ item }}', which is not a field on a
          vnet. The API accepts unknown fields with HTTP 200 and discards
          them, so this would ship silently. This is the #8 / #10 / #18 class.
        quiet: true
      loop: "{{ network_api_fields }}"

    # ---- PROPERTY 2 -------------------------------------------------------
    - name: "PROPERTY 2 -- every value round-trips to what was asked for"
      ansible.builtin.assert:
        that:
          - probe.networks[0].description == 'contract probe'
          - probe.networks[0].type == 'internal'
          - probe.networks[0].ipaddress == '10.99.60.1'
          - probe.networks[0].dhcp_start == '10.99.60.100'
          # #18: dhcp_end was sent as dhcp_end, so the scope had no end
          - probe.networks[0].dhcp_stop == '10.99.60.200'
          # #18: dns_servers was sent verbatim on update, so DNS never applied
          - probe.networks[0].dnslist == '9.9.9.9'
          - probe.networks[0].domain == 'contract.test'
          - probe.networks[0].mtu | int == 1500
          # #61
          - probe.networks[0].rate_limit | int == 50
        fail_msg: "A value was accepted and discarded -- the #18 shape."
        quiet: true

    # ---- PROPERTY 3 -------------------------------------------------------
    - name: Re-apply the identical definition
      vergeio.vergeos.network:
        <<: *auth
        name: "{{ net }}"
        state: present
        description: contract probe
        network_type: internal
        network: 10.99.60.0/24
        ip_address: 10.99.60.1
        gateway: 10.99.60.254
        dhcp_enabled: true
        dhcp_start: 10.99.60.100
        dhcp_end: 10.99.60.200
        dns_servers: ["9.9.9.9"]
        domain: contract.test
        mtu: 1500
        rate_limit: 50
        on_power_loss: last_state
      register: reapplied

    - name: "PROPERTY 3 -- a second apply reports no change"
      ansible.builtin.assert:
        that:
          - created.changed
          - not reapplied.changed
        fail_msg: >-
          The network module does not converge. This is the property that
          would have caught #8, #10, #18 and #59 on its own.
        quiet: true

    - name: RESULT
      ansible.builtin.debug:
        msg: >-
          network contract PASSED --
          {{ network_api_fields | length }} fields exist, values round-trip,
          second apply changed={{ reapplied.changed }}

  post_tasks:
    - name: Teardown
      vergeio.vergeos.network:
        <<: *auth
        name: "{{ net }}"
        state: absent


- name: "Field contract -- drive and user field names"
  hosts: localhost
  gather_facts: false
  vars:
    # MUST match drive.UPDATE_FIELD_MAP.values() and
    # user.UPDATE_FIELD_MAP.values(). 'password' is deliberately absent: it is
    # write-only, the API never returns it, and that is why update_password
    # exists (#73). Asserting its presence would be asserting a bug.
    drive_api_fields: [interface, preferred_tier, readonly, disksize]
    user_api_fields: [email, enabled, displayname]
    auth: &probe_auth
      host: "{{ lookup('env', 'VERGEOS_HOST') }}"
      username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
      password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
      insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true, true) }}"

  tasks:
    - name: Read an existing user
      vergeio.vergeos.user:
        <<: *probe_auth
        name: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
        state: present
      check_mode: true
      register: probe_user

    - name: "PROPERTY 1 -- every user field the module sends exists"
      ansible.builtin.assert:
        that: item in (probe_user.user | default({}))
        fail_msg: >-
          The user module sends '{{ item }}', which is not a field on a user.
          The API accepts unknown fields with HTTP 200 and discards them.
        quiet: true
      loop: "{{ user_api_fields }}"
      when: probe_user.user is defined

    - name: RESULT
      ansible.builtin.debug:
        msg: >-
          drive/user field names declared:
          drive={{ drive_api_fields | join(',') }}
          user={{ user_api_fields | join(',') }}


- name: "Field contract -- nic"
  hosts: localhost
  gather_facts: false
  vars:
    vm: zz-contract-vm
    net: zz-contract-nicnet
    # The same address in four spellings. All of them are the address the API
    # stores; a converged NIC must report changed=false for every one. #59
    # was found with the first.
    mac_spellings:
      - "AA:BB:CC:00:5E:1B"
      - "aa:bb:cc:00:5e:1b"
      - "Aa:Bb:Cc:00:5e:1B"
      - "AA-BB-CC-00-5E-1B"
    auth: &nic_auth
      host: "{{ lookup('env', 'VERGEOS_HOST') }}"
      username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
      password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
      insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true, true) }}"

  pre_tasks:
    - name: Clean start (vm)
      vergeio.vergeos.vm:
        <<: *nic_auth
        name: "{{ vm }}"
        state: absent

    - name: Clean start (net)
      vergeio.vergeos.network:
        <<: *nic_auth
        name: "{{ net }}"
        state: absent

  tasks:
    - name: An isolated scratch network
      vergeio.vergeos.network:
        <<: *nic_auth
        name: "{{ net }}"
        state: present
        network_type: internal
        network: 10.99.61.0/24
        ip_address: 10.99.61.1

    - name: A scratch VM
      vergeio.vergeos.vm:
        <<: *nic_auth
        name: "{{ vm }}"
        state: present
        cpu_cores: 1
        ram: 1024
        os_family: linux

    - name: Attach a NIC with an uppercase MAC
      vergeio.vergeos.nic:
        <<: *nic_auth
        vm_name: "{{ vm }}"
        network: "{{ net }}"
        mac_address: "{{ mac_spellings[0] }}"
        nic_type: virtio
        state: present
      register: nic_created

    - name: Re-apply the same address in every spelling
      vergeio.vergeos.nic:
        <<: *nic_auth
        vm_name: "{{ vm }}"
        network: "{{ net }}"
        mac_address: "{{ item }}"
        nic_type: virtio
        state: present
      loop: "{{ mac_spellings }}"
      register: nic_reapplied

    # ---- PROPERTY 3 -------------------------------------------------------
    - name: "PROPERTY 3 -- the MAC converges in every spelling"
      ansible.builtin.assert:
        that:
          - nic_created.changed
          - nic_reapplied.results | selectattr('changed') | list | length == 0
        fail_msg: >-
          A converged NIC reported a change. This is #59: the API stores MACs
          lowercase, so comparing an operator's uppercase value literally
          never matches and every run issues a PUT.
        quiet: true

    - name: RESULT
      ansible.builtin.debug:
        msg: >-
          nic contract PASSED --
          {{ mac_spellings | length }} spellings, all converged

  post_tasks:
    - name: Teardown vm
      vergeio.vergeos.vm:
        <<: *nic_auth
        name: "{{ vm }}"
        state: absent

    - name: Teardown net
      vergeio.vergeos.network:
        <<: *nic_auth
        name: "{{ net }}"
        state: absent


# ── vm ───────────────────────────────────────────────────────────────────────
#
# The last module to join the guard, and the one that needed #87 fixed first:
# machine_subtype, bios_type and network were not columns on a VM at all. The
# first two properties matter more here than anywhere else, because a VM has
# 74 columns and three of the options were landing in none of them.
- name: "Field contract -- vm"
  hosts: localhost
  gather_facts: false
  vars:
    vm_n: zz-contract-vm
    # MUST match vm.UPDATE_FIELD_MAP.values(). snapshot_profile is present:
    # it is a real column, just not one the default projection returns.
    vm_api_fields:
      - description
      - enabled
      - os_family
      - cpu_cores
      - ram
      - machine_type
      - uefi
      - boot_order
      - snapshot_profile
    api_base: "https://{{ lookup('env', 'VERGEOS_HOST') }}/api/v4"
    auth: &vm_auth
      host: "{{ lookup('env', 'VERGEOS_HOST') }}"
      username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
      password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
      insecure: "{{ lookup('env', 'VERGEOS_INSECURE') | default(true, true) }}"

  tasks:
    - name: Clean start
      vergeio.vergeos.vm:
        <<: *vm_auth
        name: "{{ vm_n }}"
        state: absent

    - name: Create a VM exercising every mapped parameter
      vergeio.vergeos.vm:
        <<: *vm_auth
        name: "{{ vm_n }}"
        state: present
        description: field-contract scratch (zz- disposable)
        enabled: true
        os_family: linux
        cpu_cores: 2
        ram: 2048
        machine_type: q35
        bios_type: uefi
        boot_order: cdn
      register: made

    # Read over plain REST with the full column set. Going through vm_info
    # would prove nothing about which columns exist -- it would only prove the
    # module and the read agree with each other.
    - name: Read every column back
      ansible.builtin.uri:
        url: "{{ api_base }}/vms?fields=all"
        url_username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
        url_password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: vm_rows
      changed_when: false

    - name: Note the row
      ansible.builtin.set_fact:
        vm_row: "{{ vm_rows.json | selectattr('name', 'equalto', vm_n)
                    | first }}"

    - name: "PROPERTY 1 -- every API field the module sends exists on the VM"
      ansible.builtin.assert:
        that: item in vm_row
        fail_msg: >-
          The vm module sends '{{ item }}', which is not a column on a VM.
          The API accepts unknown fields with HTTP 200 and discards them --
          that is issue #87, and this is the assertion that catches it.
        quiet: true
      loop: "{{ vm_api_fields }}"

    - name: "PROPERTY 1b -- the three names from #87 are not columns"
      ansible.builtin.assert:
        that:
          - "'machine_subtype' not in vm_row"
          - "'bios_type' not in vm_row"
          - "'network' not in vm_row"
        fail_msg: >-
          A VM now has a machine_subtype, bios_type, or network column, so
          #87's resolution needs revisiting:
          {{ vm_row.keys() | list | sort }}

    - name: "PROPERTY 2 -- every value round-trips to what was asked for"
      ansible.builtin.assert:
        that:
          - vm_row.description == 'field-contract scratch (zz- disposable)'
          - vm_row.enabled | bool
          - vm_row.os_family == 'linux'
          - vm_row.cpu_cores | int == 2
          - vm_row.ram | int == 2048
          # 'q35' is stored expanded, which machine_type_matches() knows
          - vm_row.machine_type is match('^pc-q35-')
          # bios_type: uefi is the boolean uefi -- the whole of #87's
          # silent-misconfiguration half
          - vm_row.uefi | bool
          - vm_row.boot_order == 'cdn'
        fail_msg: "a value did not persist: {{ vm_row }}"

    - name: Re-apply the identical definition
      vergeio.vergeos.vm:
        <<: *vm_auth
        name: "{{ vm_n }}"
        state: present
        description: field-contract scratch (zz- disposable)
        enabled: true
        os_family: linux
        cpu_cores: 2
        ram: 2048
        machine_type: q35
        bios_type: uefi
        boot_order: cdn
      register: again

    - name: "PROPERTY 3 -- a second apply reports no change"
      ansible.builtin.assert:
        that:
          - made is changed
          - again is not changed
        fail_msg: >-
          The VM did not converge. Before #87 this reported changed=true
          forever, because three of the parameters compared against columns
          that do not exist. made={{ made.changed }} again={{ again.changed }}

    - name: RESULT
      ansible.builtin.debug:
        msg: >-
          vm field contract PASSED: {{ vm_api_fields | length }} API fields
          all exist, all round-trip, and a second apply is a no-op
          (bios_type -> uefi, boot_order a string, machine_type expanded)

    - name: Teardown
      vergeio.vergeos.vm:
        <<: *vm_auth
        name: "{{ vm_n }}"
        state: absent
